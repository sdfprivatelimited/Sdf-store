<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গোডাউন (Main Store) - Modern Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
        .app-container { 
            max-width: 480px; 
            margin: 0 auto; 
            background-color: #fafafa; 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            position: relative; 
            box-shadow: 0 0 20px rgba(0,0,0,0.05); 
        }
        .menu-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }
        .menu-card:active {
            transform: scale(0.92);
        }
        ::-webkit-scrollbar { display: none; }
        .content-area { padding-bottom: 80px; } 
    </style>
</head>
<body>
    <div class="app-container">

        <!-- Modern Slim Header -->
        <div class="bg-indigo-600 text-white py-3 px-4 flex justify-between items-center shadow-md sticky top-0 z-30 rounded-b-lg">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-lg focus:outline-none hover:text-indigo-200 transition"><i class="fas fa-arrow-left"></i></a>
                <h1 class="text-lg font-bold flex items-center gap-2">
                    গোডাউন 
                    <span class="text-[9px] font-semibold bg-indigo-500/50 text-indigo-50 px-2 py-0.5 rounded-full tracking-wider uppercase border border-indigo-400">Main Store</span>
                </h1>
            </div>
            <button class="text-indigo-100 hover:text-white transition relative">
                <i class="fas fa-bell"></i>
                <span class="absolute -top-1 -right-1 flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span>
                </span>
            </button>
        </div>

        <div class="p-4 flex-1 content-area">
            
            <!-- Dashboard Main Cards -->
            <div class="grid grid-cols-2 gap-3 mb-5">
                <div class="bg-gradient-to-br from-indigo-500 to-blue-600 rounded-2xl p-4 text-white shadow-[0_4px_10px_-3px_rgba(79,70,229,0.4)] relative overflow-hidden">
                    <div class="absolute -right-4 -bottom-4 bg-white/10 w-20 h-20 rounded-full blur-xl"></div>
                    <i class="fas fa-wallet absolute top-4 right-4 text-2xl text-white/20"></i>
                    <h3 class="text-[10px] font-semibold uppercase text-indigo-100 mb-1 tracking-wider">মোট টাকার মাল</h3>
                    <h2 class="text-xl font-bold tracking-tight" id="totalStockValue">
                        <i class="fas fa-circle-notch fa-spin text-sm"></i>
                    </h2>
                </div>

                <div class="bg-gradient-to-br from-teal-400 to-emerald-600 rounded-2xl p-4 text-white shadow-[0_4px_10px_-3px_rgba(16,185,129,0.4)] relative overflow-hidden">
                    <div class="absolute -right-4 -bottom-4 bg-white/10 w-20 h-20 rounded-full blur-xl"></div>
                    <i class="fas fa-boxes absolute top-4 right-4 text-2xl text-white/20"></i>
                    <h3 class="text-[10px] font-semibold uppercase text-emerald-100 mb-1 tracking-wider">মোট প্রোডাক্ট</h3>
                    <h2 class="text-xl font-bold tracking-tight" id="totalProductsCount">
                        <i class="fas fa-circle-notch fa-spin text-sm"></i>
                    </h2>
                </div>
            </div>

            <!-- Stock Alerts Section -->
            <div class="flex items-center gap-2 mb-3">
                <div class="w-1.5 h-4 bg-red-500 rounded-full"></div>
                <h3 class="text-xs font-bold text-gray-700 uppercase tracking-wide">Stock Alerts</h3>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-6">
                <div class="bg-gradient-to-br from-amber-400 to-orange-500 rounded-2xl p-4 text-white shadow-[0_4px_10px_-3px_rgba(245,158,11,0.4)] relative overflow-hidden">
                    <div class="absolute -right-4 -bottom-4 bg-white/10 w-16 h-16 rounded-full blur-xl"></div>
                    <i class="fas fa-exclamation-triangle absolute top-4 right-4 text-2xl text-white/20"></i>
                    <h3 class="text-[10px] font-bold uppercase text-orange-50 mb-1 tracking-wider">Low Stock (≤ 5)</h3>
                    <h2 class="text-2xl font-bold tracking-tight" id="lowStockCount">
                        <i class="fas fa-circle-notch fa-spin text-sm"></i>
                    </h2>
                </div>

                <div class="bg-gradient-to-br from-rose-500 to-red-600 rounded-2xl p-4 text-white shadow-[0_4px_10px_-3px_rgba(225,29,72,0.4)] relative overflow-hidden">
                    <div class="absolute -right-4 -bottom-4 bg-white/10 w-16 h-16 rounded-full blur-xl"></div>
                    <i class="fas fa-times-circle absolute top-4 right-4 text-2xl text-white/20"></i>
                    <h3 class="text-[10px] font-bold uppercase text-red-100 mb-1 tracking-wider">No Stock (0)</h3>
                    <h2 class="text-2xl font-bold tracking-tight" id="noStockCount">
                        <i class="fas fa-circle-notch fa-spin text-sm"></i>
                    </h2>
                </div>
            </div>

            <!-- Store Management Section (ক্লিক করলে পেজ খুলবে) -->
            <div class="flex items-center gap-2 mb-3">
                <div class="w-1.5 h-4 bg-indigo-500 rounded-full"></div>
                <h3 class="text-xs font-bold text-gray-700 uppercase tracking-wide">Store Management</h3>
            </div>

            <div class="grid grid-cols-2 gap-3">
                
                <a href="add_product.html" class="menu-card bg-white p-4 rounded-2xl shadow-[0_2px_10px_-3px_rgba(0,0,0,0.05)] border border-gray-100 flex flex-col items-center justify-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl shadow-inner">
                        <i class="fas fa-box-open"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-700">Add Product</span>
                </a>

                <a href="view_products.html" class="menu-card bg-white p-4 rounded-2xl shadow-[0_2px_10px_-3px_rgba(0,0,0,0.05)] border border-gray-100 flex flex-col items-center justify-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-xl shadow-inner">
                        <i class="fas fa-list-ul"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-700">View Products</span>
                </a>

                <a href="update_stock.html" class="menu-card bg-white p-4 rounded-2xl shadow-[0_2px_10px_-3px_rgba(0,0,0,0.05)] border border-gray-100 flex flex-col items-center justify-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-orange-50 text-orange-500 flex items-center justify-center text-xl shadow-inner">
                        <i class="fas fa-sync-alt"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-700">Update Stock</span>
                </a>

                <a href="transfer_branch.html" class="menu-card bg-white p-4 rounded-2xl shadow-[0_2px_10px_-3px_rgba(0,0,0,0.05)] border border-gray-100 flex flex-col items-center justify-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-teal-50 text-teal-600 flex items-center justify-center text-xl shadow-inner">
                        <i class="fas fa-truck-fast"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-700">Transfer Branch</span>
                </a>

                <a href="purchase_entry.html" class="menu-card bg-white p-4 rounded-2xl shadow-[0_2px_10px_-3px_rgba(0,0,0,0.05)] border border-gray-100 flex flex-col items-center justify-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center text-xl shadow-inner">
                        <i class="fas fa-cart-plus"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-700">Purchase Entry</span>
                </a>

                <a href="purchase_views.html" class="menu-card bg-white p-4 rounded-2xl shadow-[0_2px_10px_-3px_rgba(0,0,0,0.05)] border border-gray-100 flex flex-col items-center justify-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-pink-50 text-pink-500 flex items-center justify-center text-xl shadow-inner">
                        <i class="fas fa-file-invoice-dollar"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-700">Purchase Views</span>
                </a>

            </div>
        </div>

        <!-- Clean Footer (Home, Stock, Profile) -->
        <div class="fixed bottom-0 w-full max-w-[480px] bg-white border-t border-gray-100 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.05)] z-40 rounded-t-2xl">
            <div class="flex justify-between items-center px-10 py-3">
                <a href="index.html" class="flex flex-col items-center text-indigo-600">
                    <i class="fas fa-house-chimney mb-1 text-xl"></i>
                    <span class="text-[10px] font-bold tracking-wide">Home</span>
                </a>
                
                <a href="view_products.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-500 transition">
                    <i class="fas fa-boxes-stacked mb-1 text-xl"></i>
                    <span class="text-[10px] font-bold tracking-wide">Stock</span>
                </a>

                <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-500 transition">
                    <i class="fas fa-user-circle mb-1 text-xl"></i>
                    <span class="text-[10px] font-bold tracking-wide">Profile</span>
                </a>
            </div>
        </div>
        
    </div>

    <!-- Firebase Script for Dashboard Analytics -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9-KJ4UGuqjqca8yBZItdp6FmESI4qGGY",
            authDomain: "sdf-store-f39bd.firebaseapp.com",
            projectId: "sdf-store-f39bd",
            storageBucket: "sdf-store-f39bd.firebasestorage.app",
            messagingSenderId: "988561141451",
            appId: "1:988561141451:web:5778ab813d980c3f6df54e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadDashboardStats() {
            try {
                const querySnapshot = await getDocs(collection(db, "inventory_purchases")); 
                
                let totalStockValue = 0;
                let totalProducts = 0;
                let lowStockCount = 0;
                let noStockCount = 0;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const qty = parseFloat(data.quantity) || 0;

                    totalStockValue += (parseFloat(data.totalPurchasePrice) || 0);
                    totalProducts++; 

                    if (qty <= 0) {
                        noStockCount++;
                    } else if (qty <= 5) {
                        lowStockCount++;
                    }
                });

                document.getElementById('totalStockValue').innerHTML = `₹${totalStockValue.toLocaleString('en-IN', { minimumFractionDigits: 2 })}`;
                document.getElementById('totalProductsCount').innerText = totalProducts;
                document.getElementById('lowStockCount').innerText = lowStockCount;
                document.getElementById('noStockCount').innerText = noStockCount;

            } catch (error) {
                console.error("Error loading stats:", error);
                document.getElementById('totalStockValue').innerText = "₹ 0.00";
                document.getElementById('totalProductsCount').innerText = "0";
                document.getElementById('lowStockCount').innerText = "0";
                document.getElementById('noStockCount').innerText = "0";
            }
        }

        window.onload = loadDashboardStats;
    </script>
</body>
</html>
