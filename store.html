<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গোডাউন (Main Store) - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f3f4f6; font-family: sans-serif; margin: 0; }
        .app-container { 
            max-width: 480px; 
            margin: 0 auto; 
            background-color: #f8fafc; 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            position: relative; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
        }
        .menu-card {
            transition: all 0.2s ease-in-out;
        }
        .menu-card:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- Header -->
        <div class="bg-indigo-600 text-white p-4 flex justify-between items-center shadow-md sticky top-0 z-30">
            <a href="index.html" class="text-xl focus:outline-none hover:text-indigo-200"><i class="fas fa-arrow-left"></i></a>
            <div class="text-center">
                <h1 class="text-xl font-bold tracking-wider">গোডাউন</h1>
                <p class="text-[10px] font-medium opacity-90 uppercase tracking-widest">(Main Store)</p>
            </div>
            <div class="w-6"></div> <!-- Spacer for centering -->
        </div>

        <div class="p-4 flex-1">
            
            <!-- Dashboard Top Cards (Data from Firebase) -->
            <div class="grid grid-cols-2 gap-3 mb-6">
                <!-- Total Stock Value Card -->
                <div class="bg-gradient-to-br from-indigo-500 to-blue-600 rounded-xl p-4 text-white shadow-lg relative overflow-hidden">
                    <i class="fas fa-wallet absolute -bottom-4 -right-2 text-5xl opacity-20"></i>
                    <h3 class="text-[10px] font-bold uppercase opacity-90 mb-1">মোট টাকার মাল</h3>
                    <h2 class="text-xl font-bold" id="totalStockValue">
                        <i class="fas fa-spinner fa-spin text-sm"></i>
                    </h2>
                </div>

                <!-- Total Products Count Card -->
                <div class="bg-gradient-to-br from-teal-500 to-emerald-600 rounded-xl p-4 text-white shadow-lg relative overflow-hidden">
                    <i class="fas fa-boxes absolute -bottom-4 -right-2 text-5xl opacity-20"></i>
                    <h3 class="text-[10px] font-bold uppercase opacity-90 mb-1">মোট প্রোডাক্ট</h3>
                    <h2 class="text-2xl font-bold" id="totalProductsCount">
                        <i class="fas fa-spinner fa-spin text-sm"></i>
                    </h2>
                </div>
            </div>

            <hr class="border-gray-200 mb-5">
            <h3 class="text-xs font-bold text-gray-500 uppercase mb-3 pl-1">Store Management</h3>

            <!-- Action Menu Grid -->
            <div class="grid grid-cols-2 gap-3">
                
                <!-- Add Product -->
                <button onclick="window.location.href='add_product.html'" class="menu-card bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2 hover:bg-indigo-50 hover:border-indigo-200">
                    <div class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-lg">
                        <i class="fas fa-box-open"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-700">Add Product</span>
                </button>

                <!-- View Products -->
                <button onclick="window.location.href='view_products.html'" class="menu-card bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2 hover:bg-indigo-50 hover:border-indigo-200">
                    <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-lg">
                        <i class="fas fa-list"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-700">View Products</span>
                </button>

                <!-- Update Stock -->
                <button onclick="window.location.href='update_stock.html'" class="menu-card bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2 hover:bg-indigo-50 hover:border-indigo-200">
                    <div class="w-10 h-10 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center text-lg">
                        <i class="fas fa-sync-alt"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-700">Update Stock</span>
                </button>

                <!-- Purchase Entry -->
                <button onclick="window.location.href='purchase_entry.html'" class="menu-card bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2 hover:bg-indigo-50 hover:border-indigo-200">
                    <div class="w-10 h-10 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-lg">
                        <i class="fas fa-cart-plus"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-700">Purchase Entry</span>
                </button>

                <!-- Purchase Views -->
                <button onclick="window.location.href='purchase_views.html'" class="menu-card bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2 hover:bg-indigo-50 hover:border-indigo-200">
                    <div class="w-10 h-10 rounded-full bg-pink-100 text-pink-600 flex items-center justify-center text-lg">
                        <i class="fas fa-file-invoice-dollar"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-700">Purchase Views</span>
                </button>

                <!-- Transfer to Branch -->
                <button onclick="window.location.href='transfer_branch.html'" class="menu-card bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2 hover:bg-indigo-50 hover:border-indigo-200">
                    <div class="w-10 h-10 rounded-full bg-teal-100 text-teal-600 flex items-center justify-center text-lg">
                        <i class="fas fa-truck-loading"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-700">Transfer Branch</span>
                </button>

            </div>
            
            <div class="h-10"></div>
        </div>
    </div>

    <!-- Firebase Script for Dashboard Analytics -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        // আপনার ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyC9-KJ4UGuqjqca8yBZItdp6FmESI4qGGY",
            authDomain: "sdf-store-f39bd.firebaseapp.com",
            projectId: "sdf-store-f39bd",
            storageBucket: "sdf-store-f39bd.firebasestorage.app",
            messagingSenderId: "988561141451",
            appId: "1:988561141451:web:5778ab813d980c3f6df54e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ডেটাবেস থেকে টোটাল ভ্যালু এবং প্রোডাক্ট কাউন্ট নিয়ে আসা
        async function loadDashboardStats() {
            try {
                // আপনি যেই কালেকশনে ডেটা সেভ করেন সেটির নাম দিন (e.g., 'inventory_purchases' or 'products')
                const querySnapshot = await getDocs(collection(db, "inventory_purchases")); 
                
                let totalStockValue = 0;
                let totalProducts = 0;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // টোটাল কেনা দাম যোগ করা হচ্ছে
                    totalStockValue += (parseFloat(data.totalPurchasePrice) || 0);
                    
                    // যতগুলো এন্ট্রি/প্রোডাক্ট আছে তা কাউন্ট করা হচ্ছে
                    totalProducts++; 
                });

                // UI তে ডেটা বসানো হচ্ছে
                document.getElementById('totalStockValue').innerText = `₹ ${totalStockValue.toFixed(2)}`;
                document.getElementById('totalProductsCount').innerText = totalProducts;

            } catch (error) {
                console.error("Error loading stats:", error);
                document.getElementById('totalStockValue').innerText = "₹ 0.00";
                document.getElementById('totalProductsCount').innerText = "0";
            }
        }

        // পেজ লোড হওয়ার সাথে সাথে ফাংশনটি কল হবে
        window.onload = loadDashboardStats;
    </script>
</body>
</html>
