<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill & Payment - SDF STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
        .app-container { 
            max-width: 480px; 
            margin: 0 auto; 
            background-color: #fafafa; 
            min-height: 100vh; 
            position: relative; 
            box-shadow: 0 0 20px rgba(0,0,0,0.05); 
            display: flex;
            flex-direction: column;
        }
        ::-webkit-scrollbar { display: none; }
        .content-area { padding-bottom: 90px; flex: 1; }
        /* Click animation */
        .menu-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .menu-card:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- Modern Slim Header -->
        <div class="bg-indigo-600 text-white py-3 px-4 flex justify-between items-center shadow-md sticky top-0 z-30 rounded-b-lg">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-lg focus:outline-none hover:text-indigo-200 transition"><i class="fas fa-arrow-left"></i></a>
                <h1 class="text-lg font-bold flex items-center gap-2">
                    Accounts 
                    <span class="text-[9px] font-semibold bg-indigo-500/50 text-indigo-50 px-2 py-0.5 rounded-full tracking-wider uppercase border border-indigo-400">Finance</span>
                </h1>
            </div>
            <button class="text-indigo-100 hover:text-white transition text-lg">
                <i class="fas fa-calculator"></i>
            </button>
        </div>

        <div class="p-4 content-area mt-4 flex flex-col gap-5">
            
            <!-- Information Text -->
            <div class="text-center mb-2">
                <h2 class="text-xl font-extrabold text-gray-800">Billing & Payments</h2>
                <p class="text-xs text-gray-500 mt-1">Select an option below to proceed</p>
            </div>

            <!-- Bill Card -->
            <a href="branch_entry.html" class="menu-card block bg-gradient-to-br from-indigo-500 to-blue-600 rounded-3xl p-6 text-white shadow-[0_8px_20px_-3px_rgba(79,70,229,0.4)] relative overflow-hidden">
                <!-- Background decoration -->
                <div class="absolute -right-6 -bottom-6 bg-white/10 w-32 h-32 rounded-full blur-2xl"></div>
                <i class="fas fa-file-invoice absolute -right-2 -bottom-2 text-7xl text-white/10 transform -rotate-12"></i>
                
                <div class="relative z-10">
                    <div class="bg-white/20 w-12 h-12 rounded-2xl flex items-center justify-center text-2xl mb-4 backdrop-blur-sm border border-white/20">
                        <i class="fas fa-receipt"></i>
                    </div>
                    <h2 class="text-2xl font-bold tracking-wide mb-1">Bill (বিল)</h2>
                    <p class="text-xs text-indigo-100 font-medium">Create new bills, branch entry, or view purchase history.</p>
                </div>
            </a>

            <!-- Payment Card -->
            <a href="Payments.html" class="menu-card block bg-gradient-to-br from-emerald-500 to-teal-600 rounded-3xl p-6 text-white shadow-[0_8px_20px_-3px_rgba(16,185,129,0.4)] relative overflow-hidden mt-2">
                <!-- Background decoration -->
                <div class="absolute -right-6 -bottom-6 bg-white/10 w-32 h-32 rounded-full blur-2xl"></div>
                <i class="fas fa-hand-holding-dollar absolute -right-2 -bottom-2 text-7xl text-white/10 transform -rotate-12"></i>
                
                <div class="relative z-10">
                    <div class="bg-white/20 w-12 h-12 rounded-2xl flex items-center justify-center text-2xl mb-4 backdrop-blur-sm border border-white/20">
                        <i class="fas fa-wallet"></i>
                    </div>
                    <h2 class="text-2xl font-bold tracking-wide mb-1">Payment (পেমেন্ট)</h2>
                    <p class="text-xs text-emerald-100 font-medium">Manage dues (বাকি), clear supplier payments, and track cash.</p>
                </div>
            </a>

        </div>

        <!-- Clean Footer (Home, Stock, Profile) -->
        <div class="fixed bottom-0 w-full max-w-[480px] bg-white border-t border-gray-100 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.05)] z-40 rounded-t-2xl">
            <div class="flex justify-between items-center px-10 py-3">
                <a href="index.html" class="flex flex-col items-center text-indigo-600 transition">
                    <i class="fas fa-house-chimney mb-1 text-xl"></i>
                    <span class="text-[10px] font-bold tracking-wide">Home</span>
                </a>
                
                <a href="view_products.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-500 transition">
                    <i class="fas fa-boxes-stacked mb-1 text-xl"></i>
                    <span class="text-[10px] font-bold tracking-wide">Stock</span>
                </a>

                <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-500 transition">
                    <i class="fas fa-user-circle mb-1 text-xl"></i>
                    <span class="text-[10px] font-bold tracking-wide">Profile</span>
                </a>
            </div>
        </div>
        
    </div>
</body>
</html>
