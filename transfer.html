<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer to Branch - SDF STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f3f4f6; font-family: sans-serif; margin: 0; }
        .app-container { 
            max-width: 480px; 
            margin: 0 auto; 
            background-color: #f8fafc; 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            position: relative; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
        }
        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 15px;
        }
        .scrollable-content::-webkit-scrollbar { display: none; }
        .scrollable-content { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- Header -->
        <div class="bg-indigo-600 text-white p-4 flex justify-between items-center shadow-md sticky top-0 z-30">
            <a href="store.html" class="text-xl focus:outline-none hover:text-indigo-200"><i class="fas fa-arrow-left"></i></a>
            <h1 class="text-xl font-bold tracking-wider">TRANSFER STOCK</h1>
            <div class="w-6"></div>
        </div>

        <div class="scrollable-content">
            
            <!-- 1. TRANSFER FORM (ওপরে ফর্ম) -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 mb-6">
                <h3 class="text-xs font-bold text-indigo-600 uppercase mb-4 border-b border-gray-100 pb-2">
                    <i class="fas fa-paper-plane mr-1"></i> Send Stock To Branch
                </h3>
                
                <form id="transferForm" class="flex flex-col gap-4">
                    
                    <!-- Date -->
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase">Transfer Date</label>
                        <input type="date" id="transferDate" class="w-full border border-gray-300 p-3 rounded-xl focus:outline-none focus:border-indigo-500 bg-gray-50 text-sm font-bold text-gray-700" required>
                    </div>

                    <!-- Branch Select -->
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase">Select Branch</label>
                        <select id="branchName" class="w-full border border-gray-300 p-3 rounded-xl focus:outline-none focus:border-indigo-500 bg-gray-50 text-sm font-bold text-gray-700" required>
                            <option value="" disabled selected>Choose a branch...</option>
                            <option value="Sangrampur">Sangrampur</option>
                            <option value="Baruipur">Baruipur</option>
                            <option value="Magrahat">Magrahat</option>
                        </select>
                    </div>

                    <!-- Amount -->
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase">Total Stock Value (₹)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-500 font-bold">₹</span>
                            <input type="number" id="transferAmount" placeholder="0.00" class="w-full border border-gray-300 p-3 pl-9 rounded-xl focus:outline-none focus:border-indigo-500 text-lg font-bold text-gray-800" required>
                        </div>
                    </div>
                    
                    <!-- Remarks -->
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase">Details/Bill Note (Optional)</label>
                        <input type="text" id="remarks" placeholder="E.g., Sent 50Kg Kaju via Auto" class="w-full border border-gray-300 p-3 rounded-xl focus:outline-none focus:border-indigo-500 text-sm bg-gray-50">
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl mt-2 shadow-md transform transition hover:scale-105 active:scale-95 flex justify-center items-center gap-2">
                        <i class="fas fa-check-circle"></i> Send Now
                    </button>
                </form>
            </div>

            <!-- 2. BRANCH CARDS TO VIEW HISTORY (নিচে হিস্ট্রি দেখার কার্ড) -->
            <h3 class="text-xs font-bold text-gray-500 uppercase mb-3 text-center">View Branch Transfer History</h3>
            
            <div class="grid grid-cols-2 gap-3 mb-5">
                <!-- Sangrampur Card -->
                <a href="transfer_views.html?branch=Sangrampur" class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col items-center justify-center text-center transform transition hover:scale-105 active:scale-95">
                    <div class="bg-blue-50 text-blue-500 w-12 h-12 rounded-full flex items-center justify-center mb-2">
                        <i class="fas fa-store text-xl"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-800 uppercase">Sangrampur</span>
                    <span class="text-[9px] text-gray-400 font-semibold mt-1">View Data</span>
                </a>

                <!-- Baruipur Card -->
                <a href="transfer_views.html?branch=Baruipur" class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col items-center justify-center text-center transform transition hover:scale-105 active:scale-95">
                    <div class="bg-green-50 text-green-500 w-12 h-12 rounded-full flex items-center justify-center mb-2">
                        <i class="fas fa-store-alt text-xl"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-800 uppercase">Baruipur</span>
                    <span class="text-[9px] text-gray-400 font-semibold mt-1">View Data</span>
                </a>

                <!-- Magrahat Card (Full width) -->
                <a href="transfer_views.html?branch=Magrahat" class="col-span-2 bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between px-6 transform transition hover:scale-105 active:scale-95">
                    <div class="flex items-center gap-3">
                        <div class="bg-orange-50 text-orange-500 w-12 h-12 rounded-full flex items-center justify-center">
                            <i class="fas fa-store text-xl"></i>
                        </div>
                        <span class="text-sm font-bold text-gray-800 uppercase">Magrahat</span>
                    </div>
                    <span class="text-[10px] text-gray-400 font-semibold uppercase bg-gray-50 px-2 py-1 rounded">View Data <i class="fas fa-chevron-right ml-1"></i></span>
                </a>
            </div>
            
            <div class="h-10"></div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9-KJ4UGuqjqca8yBZItdp6FmESI4qGGY",
            authDomain: "sdf-store-f39bd.firebaseapp.com",
            projectId: "sdf-store-f39bd",
            storageBucket: "sdf-store-f39bd.firebasestorage.app",
            messagingSenderId: "988561141451",
            appId: "1:988561141451:web:5778ab813d980c3f6df54e",
            measurementId: "G-WH88QMN0Z5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Set default date
        document.getElementById('transferDate').valueAsDate = new Date();

        document.getElementById('transferForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            btn.disabled = true;

            const branchName = document.getElementById('branchName').value;
            const transferDate = document.getElementById('transferDate').value;
            const transferAmount = parseFloat(document.getElementById('transferAmount').value);
            const remarks = document.getElementById('remarks').value || "";

            if(transferAmount <= 0) {
                alert("Please enter a valid amount!");
                resetButton(btn);
                return;
            }

            try {
                // 1. Save record in 'store_transfers'
                await addDoc(collection(db, "store_transfers"), {
                    branchName: branchName,
                    date: transferDate,
                    transferAmount: transferAmount,
                    remarks: remarks,
                    timestamp: serverTimestamp()
                });

                // 2. Add to Branch Stock (Increases Branch balance)
                const branchRef = doc(db, "branches_data", branchName);
                const branchSnap = await getDoc(branchRef);
                
                if (branchSnap.exists()) {
                    const currentStockValue = parseFloat(branchSnap.data().totalStockValue) || 0;
                    await updateDoc(branchRef, {
                        totalStockValue: currentStockValue + transferAmount,
                        lastUpdated: serverTimestamp()
                    });
                } else {
                    await setDoc(branchRef, {
                        totalStockValue: transferAmount,
                        lastUpdated: serverTimestamp()
                    });
                }

                alert(`✅ ₹${transferAmount} successfully sent to ${branchName}!`);
                
                // Form Reset
                document.getElementById('transferForm').reset();
                document.getElementById('transferDate').valueAsDate = new Date();

            } catch (error) {
                console.error("Error transferring stock:", error);
                alert("❌ Problem transferring data. Check connection.");
            }

            resetButton(btn);
        });

        function resetButton(btn) {
            btn.innerHTML = '<i class="fas fa-check-circle"></i> Send Now';
            btn.disabled = false;
        }
    </script>
</body>
</html>
