<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Bill - SDF STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f3f4f6; font-family: 'Courier New', Courier, monospace; margin: 0; }
        
        .app-container { 
            max-width: 480px; 
            margin: 0 auto; 
            background-color: #e5e7eb; 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            position: relative; 
        }

        .receipt-container {
            background: white;
            padding: 15px;
            margin: 20px auto;
            width: 90%;
            max-width: 320px; /* Thermal printer width */
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            color: #000;
            font-size: 13px;
        }

        .border-dashed-custom { border-bottom: 1px dashed #000; margin: 10px 0; }

        /* Print korar shomoy ei style ta kaj korbe */
        @media print {
            body { background-color: white; margin: 0; padding: 0; }
            .app-container { background-color: white; }
            .no-print { display: none !important; }
            .receipt-container { 
                margin: 0; 
                padding: 0; 
                width: 100%; 
                max-width: 80mm; 
                box-shadow: none; 
            }
        }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- Top Header (Will hide on print) -->
        <div class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md no-print sticky top-0">
            <button onclick="window.history.back()" class="text-lg focus:outline-none"><i class="fas fa-arrow-left"></i> Back</button>
            <h1 class="text-lg font-bold">Print Preview</h1>
            <button onclick="window.print()" class="text-lg font-bold bg-white text-blue-600 px-3 py-1 rounded shadow"><i class="fas fa-print"></i> Print</button>
        </div>

        <div class="flex-1 pb-10">
            
            <div id="loading" class="text-center mt-10 text-blue-600 font-bold no-print"><i class="fas fa-spinner fa-spin text-3xl mb-2"></i><p>Preparing Bill...</p></div>

            <!-- Receipt Area -->
            <div class="receipt-container hidden" id="receiptArea"></div>

            <!-- Bottom Print Button (Will hide on print) -->
            <div class="px-5 mt-6 no-print hidden" id="printBtnArea">
                <button onclick="window.print()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg text-lg flex justify-center items-center gap-2">
                    <i class="fas fa-print text-2xl"></i> Click Here to Print
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9-KJ4UGuqjqca8yBZItdp6FmESI4qGGY",
            authDomain: "sdf-store-f39bd.firebaseapp.com",
            projectId: "sdf-store-f39bd",
            storageBucket: "sdf-store-f39bd.firebasestorage.app",
            messagingSenderId: "988561141451",
            appId: "1:988561141451:web:5778ab813d980c3f6df54e"
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        const billId = new URLSearchParams(window.location.search).get('id');

        async function loadBill() {
            if (!billId) return;
            const docSnap = await getDoc(doc(db, "wholesale_bills", billId));
            if (docSnap.exists()) {
                document.getElementById('loading').style.display = 'none';
                renderReceipt(docSnap.data());
            }
        }

        function renderReceipt(data) {
            let displayDate = new Date(data.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            
            let receiptItems = '';
            if (data.items) {
                data.items.forEach(item => {
                    // Discount thakle dekhabe, na thakle faka thakbe
                    let discountText = (item.discount && item.discount > 0) ? `<div style="font-size: 10px; color: #444; margin-top: 1px;">Discount: -₹${item.discount}</div>` : '';
                    
                    receiptItems += `
                        <div style="margin-bottom: 6px;">
                            <div style="display: flex; justify-content: space-between;">
                                <span style="width: 50%; font-size: 12px; font-weight: bold;">${item.name}</span>
                                <span style="width: 20%; text-align: center; font-size: 12px;">${item.qty} ${item.unit}</span>
                                <span style="width: 30%; text-align: right; font-size: 12px; font-weight: bold;">${item.totalItemPrice}</span>
                            </div>
                            ${discountText}
                        </div>
                    `;
                });
            }

            let receiptDueHTML = data.paymentStatus === 'Due' ? `
                <div style="display: flex; justify-content: space-between; margin-bottom: 3px;">
                    <span>Paid Amount:</span><span>₹${data.paidAmount}</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-weight: bold;">
                    <span>Total Due:</span><span>₹${data.dueAmount}</span>
                </div>
            ` : `
                <div style="display: flex; justify-content: space-between; font-weight: bold;">
                    <span>Status:</span><span>Full Paid</span>
                </div>
            `;

            document.getElementById('receiptArea').innerHTML = `
                <div style="text-align: center; margin-bottom: 10px;">
                    <h2 style="font-size: 22px; font-weight: bold; margin: 0; font-family: sans-serif;">SDF STORE</h2>
                    <p style="font-size: 10px; margin: 2px 0;">Sangrampur | Baruipur | Magrahat</p>
                    <p style="font-size: 14px; font-weight: bold; margin: 8px 0; border: 1px solid #000; display: inline-block; padding: 2px 8px;">WHOLESALE INVOICE</p>
                </div>

                <div class="border-dashed-custom"></div>

                <div style="margin-bottom: 8px; font-size: 12px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                        <span>Date: ${displayDate}</span>
                        <span>Bill: ${data.billNo || 'N/A'}</span>
                    </div>
                    <div>Customer: <strong style="font-size: 14px;">${data.customerName}</strong></div>
                </div>

                <div class="border-dashed-custom"></div>

                <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 6px; font-size: 12px;">
                    <span style="width: 50%;">Item</span>
                    <span style="width: 20%; text-align: center;">Qty</span>
                    <span style="width: 30%; text-align: right;">Total(₹)</span>
                </div>

                <div style="margin-bottom: 10px;">
                    ${receiptItems}
                </div>

                <div class="border-dashed-custom"></div>

                <div style="font-size: 13px;">
                    <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; margin-bottom: 6px;">
                        <span>Grand Total:</span><span>₹${data.grandTotal}</span>
                    </div>
                    ${receiptDueHTML}
                </div>

                <div class="border-dashed-custom"></div>

                <div style="text-align: center; margin-top: 15px;">
                    <p style="font-weight: bold; font-size: 14px; margin: 0;">Thank You!</p>
                    <p style="font-size: 11px; margin: 4px 0;">Visit Again</p>
                </div>
            `;
            
            document.getElementById('receiptArea').classList.remove('hidden');
            document.getElementById('printBtnArea').classList.remove('hidden');
        }

        window.onload = loadBill;
    </script>
</body>
</html>
