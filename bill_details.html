<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Details - SDF STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
        .app-container { max-width: 480px; margin: 0 auto; background-color: #fafafa; min-height: 100vh; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- Header (with Back button) -->
        <div class="bg-indigo-600 text-white py-3 px-4 flex justify-between items-center shadow-md sticky top-0 z-30 rounded-b-lg">
            <div class="flex items-center gap-3">
                <button onclick="history.back()" class="text-lg focus:outline-none hover:text-indigo-200 transition"><i class="fas fa-arrow-left"></i></button>
                <h1 class="text-lg font-bold flex items-center gap-2 uppercase">
                    Bill Details
                </h1>
            </div>
            <button onclick="window.print()" class="text-indigo-100 hover:text-white transition"><i class="fas fa-print"></i></button>
        </div>

        <div class="p-4 flex-1">
            
            <!-- Loading Indicator -->
            <div id="loadingIndicator" class="text-center py-20 text-gray-400">
                <i class="fas fa-circle-notch fa-spin text-4xl mb-3 text-indigo-500"></i>
                <p class="text-sm font-semibold text-gray-500">Fetching Bill Details...</p>
            </div>

            <!-- Bill Content -->
            <div id="billContent" class="hidden">
                
                <!-- Bill Top Info -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-4">
                    <div class="flex justify-between items-start border-b border-gray-100 pb-3 mb-3">
                        <div>
                            <p class="text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1">Branch Name</p>
                            <h2 class="text-lg font-black text-indigo-900" id="b_branch">---</h2>
                        </div>
                        <div class="text-right">
                            <p class="text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1">Bill Date</p>
                            <h3 class="text-sm font-bold text-gray-800" id="b_date">---</h3>
                        </div>
                    </div>
                    <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100 flex justify-between items-center">
                        <span class="text-xs font-bold text-indigo-800 uppercase">Bill No / Challan:</span>
                        <span class="text-sm font-black text-indigo-900" id="b_no">---</span>
                    </div>
                </div>

                <!-- Products List -->
                <h3 class="text-xs font-bold text-gray-600 uppercase mb-3 px-1"><i class="fas fa-box-open text-indigo-500 mr-1"></i> Transferred Items</h3>
                
                <div id="itemsContainer" class="flex flex-col gap-3 mb-6">
                    <!-- Items will be injected here -->
                </div>

                <!-- Grand Total -->
                <div class="bg-indigo-600 p-5 rounded-2xl shadow-lg text-white flex justify-between items-center mb-6">
                    <span class="text-sm font-bold uppercase tracking-wider">Grand Total (Buy)</span>
                    <span class="text-2xl font-black">₹ <span id="b_total">0.00</span></span>
                </div>
            </div>

        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyC9-KJ4UGuqjqca8yBZItdp6FmESI4qGGY", 
            authDomain: "sdf-store-f39bd.firebaseapp.com", 
            projectId: "sdf-store-f39bd", 
            storageBucket: "sdf-store-f39bd.firebasestorage.app", 
            messagingSenderId: "988561141451", 
            appId: "1:988561141451:web:5778ab813d980c3f6df54e" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.loadBillDetails = async function() {
            // Get Bill ID from URL (e.g. ?id=ABC123XYZ)
            const urlParams = new URLSearchParams(window.location.search);
            const billId = urlParams.get('id');

            if (!billId) {
                document.getElementById('loadingIndicator').innerHTML = `<p class="text-red-500 font-bold">Invalid Bill ID!</p>`;
                return;
            }

            try {
                const docRef = doc(db, "branch_bills", billId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const bill = docSnap.data();
                    
                    // Set Top Info
                    document.getElementById('b_branch').innerText = bill.branchName || 'N/A';
                    document.getElementById('b_date').innerText = bill.date ? new Date(bill.date).toLocaleDateString('en-GB') : 'N/A';
                    document.getElementById('b_no').innerText = bill.billNo || 'N/A';
                    document.getElementById('b_total').innerText = (parseFloat(bill.grandTotalBuy) || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 });

                    // Render Items
                    const itemsContainer = document.getElementById('itemsContainer');
                    let itemsHtml = "";

                    if (bill.items && bill.items.length > 0) {
                        bill.items.forEach((item, index) => {
                            itemsHtml += `
                            <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                                <div class="flex justify-between items-start mb-2">
                                    <h4 class="text-sm font-bold text-gray-800">${index + 1}. ${item.name || 'Item'}</h4>
                                    <span class="text-sm font-black text-indigo-700">₹${(parseFloat(item.totalBuy) || 0).toFixed(2)}</span>
                                </div>
                                
                                <div class="flex flex-wrap gap-2 text-[10px] font-semibold uppercase mt-2 border-t border-gray-50 pt-2">
                                    <span class="bg-indigo-50 text-indigo-700 px-2 py-1 rounded border border-indigo-100">Qty: ${item.qty} ${item.unit}</span>
                                    <span class="bg-blue-50 text-blue-700 px-2 py-1 rounded border border-blue-100">Buy: ₹${item.buyPrice || 0}</span>
                                    <span class="bg-green-50 text-green-700 px-2 py-1 rounded border border-green-100">Sell: ₹${item.sellPrice || 0}</span>
                                </div>
                            </div>
                            `;
                        });
                    } else {
                        itemsHtml = `<p class="text-center text-xs text-gray-400 font-bold py-5">No items found in this bill.</p>`;
                    }

                    itemsContainer.innerHTML = itemsHtml;
                    
                    // Show Content, Hide Loader
                    document.getElementById('loadingIndicator').classList.add('hidden');
                    document.getElementById('billContent').classList.remove('hidden');

                } else {
                    document.getElementById('loadingIndicator').innerHTML = `<p class="text-red-500 font-bold">Bill not found in database!</p>`;
                }
            } catch (error) {
                document.getElementById('loadingIndicator').innerHTML = `<p class="text-red-500 font-bold">Error loading bill: ${error.message}</p>`;
            }
        };

        window.onload = loadBillDetails;
    </script>
</body>
</html>
