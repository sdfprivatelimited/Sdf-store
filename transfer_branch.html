<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch Entry - SDF STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
        .app-container { 
            max-width: 480px; 
            margin: 0 auto; 
            background-color: #fafafa; 
            min-height: 100vh; 
            position: relative; 
            box-shadow: 0 0 20px rgba(0,0,0,0.05); 
            display: flex;
            flex-direction: column;
        }
        ::-webkit-scrollbar { display: none; }
        .suggestion-scroll::-webkit-scrollbar { display: block; width: 4px; }
        .suggestion-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .content-area { padding-bottom: 90px; }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- Modern Header -->
        <div class="bg-indigo-600 text-white py-3 px-4 flex justify-between items-center shadow-md sticky top-0 z-30 rounded-b-lg">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-lg focus:outline-none hover:text-indigo-200 transition"><i class="fas fa-arrow-left"></i></a>
                <h1 class="text-lg font-bold flex items-center gap-2">
                    Branch Entry
                    <span class="text-[9px] font-semibold bg-indigo-500/50 text-indigo-50 px-2 py-0.5 rounded-full tracking-wider uppercase border border-indigo-400">New Bill</span>
                </h1>
            </div>
            <div class="bg-white/20 px-2 py-1 rounded-lg text-[10px] font-bold" id="dbStatus">
                <i class="fas fa-spinner fa-spin"></i>
            </div>
        </div>

        <div class="p-4 flex-1 content-area">
            
            <!-- STEP 1: Bill Information -->
            <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100 mb-5 relative shadow-sm" id="billInfoSection">
                <h3 class="text-xs font-bold text-indigo-800 uppercase mb-3 flex items-center gap-2"><i class="fas fa-file-invoice"></i> 1. Bill Information</h3>
                
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase block mb-1">Date</label>
                        <input type="date" id="entryDate" class="w-full border border-indigo-200 p-2.5 rounded-xl text-sm bg-white outline-none focus:border-indigo-500 font-semibold text-gray-700">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase block mb-1">Bill No (Optional)</label>
                        <input type="text" id="billNo" placeholder="Bill / Challan" class="w-full border border-indigo-200 p-2.5 rounded-xl text-sm bg-white outline-none focus:border-indigo-500 font-semibold text-gray-700">
                    </div>
                </div>
                
                <div>
                    <label class="text-[10px] font-bold text-gray-500 uppercase block mb-1">Select Branch <span class="text-red-500">*</span></label>
                    <select id="branchSelect" class="w-full border border-indigo-200 p-3 rounded-xl text-sm bg-white outline-none focus:border-indigo-500 font-bold text-indigo-900 shadow-inner">
                        <option value="">-- Choose Branch --</option>
                        <option value="Sangrampur">Sangrampur</option>
                        <option value="Magrahat">Magrahat</option>
                        <option value="Baruipur">Baruipur</option>
                    </select>
                </div>
            </div>

            <!-- STEP 2: Product Entry -->
            <div id="productEntrySection" class="bg-white p-4 rounded-2xl shadow-[0_2px_10px_-3px_rgba(0,0,0,0.05)] border border-gray-100 mb-5">
                <h3 class="text-xs font-bold text-gray-700 uppercase mb-3 flex items-center gap-2"><i class="fas fa-box-open text-indigo-500"></i> 2. Add Product</h3>
                
                <!-- Smart Search -->
                <div class="relative mb-4 z-20">
                    <label class="text-[10px] font-bold text-gray-500 uppercase mb-1 block">Search Product</label>
                    <i class="fas fa-search absolute left-3 top-8 text-indigo-400"></i>
                    <input type="text" id="searchInput" placeholder="Type to search..." class="w-full bg-gray-50 border border-gray-200 p-3 pl-9 rounded-xl focus:outline-none focus:border-indigo-500 shadow-inner transition font-semibold text-sm text-gray-800" oninput="showSuggestions(this.value)" onfocus="showSuggestions(this.value)" autocomplete="off">
                    
                    <!-- Suggestions Dropdown -->
                    <div id="suggestionBox" class="hidden absolute w-full bg-white border border-gray-100 rounded-xl mt-1 shadow-2xl max-h-60 overflow-y-auto suggestion-scroll top-full left-0 z-50">
                        <!-- Data injected via JS -->
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase mb-1 block">Unit</label>
                        <select id="unitType" class="w-full border border-gray-200 p-3 rounded-xl text-sm bg-gray-50 outline-none focus:border-indigo-500">
                            <option value="Kg">Kg</option>
                            <option value="Gram">Gram</option>
                            <option value="Piece">Piece</option>
                            <option value="Box">Box</option>
                            <option value="Pack">Pack</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase mb-1 block">Quantity</label>
                        <input type="number" id="quantity" placeholder="Qty" class="w-full border border-gray-200 p-3 rounded-xl text-sm bg-gray-50 outline-none focus:border-indigo-500 font-bold text-center" oninput="calculateTotals()">
                    </div>
                </div>

                <!-- Per Unit Prices -->
                <div class="grid grid-cols-3 gap-2 mb-3">
                    <div class="bg-blue-50 p-2 rounded-xl border border-blue-100 text-center">
                        <label class="text-[8px] font-bold text-blue-700 uppercase block mb-1">Buy / Unit</label>
                        <input type="number" id="buyPrice" placeholder="₹" class="w-full border border-blue-200 p-1.5 rounded-lg focus:outline-none text-xs bg-white text-center font-bold" oninput="calculateTotals()">
                    </div>
                    <div class="bg-green-50 p-2 rounded-xl border border-green-100 text-center">
                        <label class="text-[8px] font-bold text-green-700 uppercase block mb-1">Sell / Unit</label>
                        <input type="number" id="sellPrice" placeholder="₹" class="w-full border border-green-200 p-1.5 rounded-lg focus:outline-none text-xs bg-white text-center font-bold" oninput="calculateTotals()">
                    </div>
                    <div class="bg-purple-50 p-2 rounded-xl border border-purple-100 text-center">
                        <label class="text-[8px] font-bold text-purple-700 uppercase block mb-1">MRP</label>
                        <input type="number" id="mrpPrice" placeholder="₹" class="w-full border border-purple-200 p-1.5 rounded-lg focus:outline-none text-xs bg-white text-center font-bold" oninput="calculateTotals()">
                    </div>
                </div>

                <!-- Total Calculated Display (3 Colored Boxes) -->
                <div class="grid grid-cols-3 gap-2 mb-4">
                    <div class="bg-blue-100 p-2 rounded-lg text-center">
                        <span class="block text-[8px] font-bold text-blue-600 uppercase">Total Buy</span>
                        <span class="block text-xs font-bold text-blue-800 mt-0.5" id="totalBuyDisplay">₹0.00</span>
                    </div>
                    <div class="bg-green-100 p-2 rounded-lg text-center">
                        <span class="block text-[8px] font-bold text-green-600 uppercase">Total Sell</span>
                        <span class="block text-xs font-bold text-green-800 mt-0.5" id="totalSellDisplay">₹0.00</span>
                    </div>
                    <div class="bg-purple-100 p-2 rounded-lg text-center">
                        <span class="block text-[8px] font-bold text-purple-600 uppercase">Total MRP</span>
                        <span class="block text-xs font-bold text-purple-800 mt-0.5" id="totalMrpDisplay">₹0.00</span>
                    </div>
                </div>

                <button onclick="addProductToBill()" class="w-full bg-indigo-100 text-indigo-700 border border-indigo-300 font-bold py-3.5 rounded-xl shadow-sm transform transition hover:scale-[1.02] active:scale-95 text-sm flex justify-center items-center gap-2">
                    <i class="fas fa-cart-plus"></i> Add to Bill List
                </button>
            </div>

            <!-- STEP 3: Bill Summary (Cart) -->
            <div id="billSummarySection" class="hidden bg-white p-4 rounded-2xl shadow-[0_2px_10px_-3px_rgba(0,0,0,0.05)] border border-gray-100 mb-5">
                <div class="flex justify-between items-center mb-3 border-b border-gray-100 pb-2">
                    <h3 class="text-xs font-bold text-emerald-600 uppercase"><i class="fas fa-list-check"></i> 3. Added Items</h3>
                    <span class="text-[10px] font-bold text-white bg-emerald-500 px-2 py-1 rounded-md shadow-sm" id="itemCountBadge">0 Items</span>
                </div>
                
                <div id="productList" class="flex flex-col gap-3 mb-4 max-h-60 overflow-y-auto pr-1 suggestion-scroll">
                    <!-- Added items will appear here -->
                </div>

                <!-- Grand Total -->
                <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100 mb-4 flex justify-between items-center shadow-inner">
                    <div>
                        <span class="block text-[10px] font-bold text-emerald-600 uppercase">Grand Total (Buy)</span>
                        <span class="text-xl font-black text-emerald-700">₹ <span id="grandTotal">0.00</span></span>
                    </div>
                </div>

                <!-- Save Full Bill Button -->
                <button onclick="saveFullBill()" id="saveBtn" class="w-full bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-500/30 transform transition hover:scale-[1.02] active:scale-95 flex justify-center items-center gap-2">
                    <i class="fas fa-save text-lg"></i> Save Complete Bill
                </button>
            </div>
            
        </div>

        <!-- Clean Footer -->
        <div class="fixed bottom-0 w-full max-w-[480px] bg-white border-t border-gray-100 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.05)] z-40 rounded-t-2xl">
            <div class="flex justify-between items-center px-10 py-3">
                <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600 transition">
                    <i class="fas fa-house-chimney mb-1 text-xl"></i>
                    <span class="text-[10px] font-bold tracking-wide">Home</span>
                </a>
                <a href="view_products.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-500 transition">
                    <i class="fas fa-boxes-stacked mb-1 text-xl"></i>
                    <span class="text-[10px] font-bold tracking-wide">Stock</span>
                </a>
                <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-500 transition">
                    <i class="fas fa-user-circle mb-1 text-xl"></i>
                    <span class="text-[10px] font-bold tracking-wide">Profile</span>
                </a>
            </div>
        </div>
        
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9-KJ4UGuqjqca8yBZItdp6FmESI4qGGY",
            authDomain: "sdf-store-f39bd.firebaseapp.com",
            projectId: "sdf-store-f39bd",
            storageBucket: "sdf-store-f39bd.firebasestorage.app",
            messagingSenderId: "988561141451",
            appId: "1:988561141451:web:5778ab813d980c3f6df54e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Global Variables
        window.billItems = []; 
        let allProducts = [];

        // Set default date
        document.getElementById('entryDate').valueAsDate = new Date();

        // 1. Load Products for Search
        window.loadData = async function() {
            try {
                const querySnapshot = await getDocs(collection(db, "inventory_purchases")); 
                allProducts = []; 
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    data.id = doc.id; 
                    allProducts.push(data);
                });
                document.getElementById('dbStatus').innerHTML = `<i class="fas fa-check-circle text-green-300"></i> Ready`;
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('dbStatus').innerHTML = `<i class="fas fa-times-circle text-red-300"></i> Error`;
            }
        };

        // 2. Search Autocomplete
        window.showSuggestions = function(value) {
            const box = document.getElementById('suggestionBox');
            if (!value.trim()) {
                box.classList.add('hidden');
                return;
            }

            const filtered = allProducts.filter(p => p.productName.toLowerCase().includes(value.toLowerCase()));
            
            if (filtered.length > 0) {
                box.innerHTML = filtered.map(p => {
                    return `
                    <div onclick="selectProduct('${p.productName}', '${p.unit}', ${p.buyPricePerUnit}, ${p.sellPricePerUnit}, ${p.mrpPerUnit})" class="p-3 border-b border-gray-50 hover:bg-indigo-50 cursor-pointer transition flex justify-between items-center">
                        <span class="text-sm font-bold text-gray-800">${p.productName}</span>
                        <span class="text-[9px] text-gray-500 bg-gray-100 px-2 py-1 rounded">Buy: ₹${p.buyPricePerUnit}</span>
                    </div>
                `}).join('');
                box.classList.remove('hidden');
            } else {
                box.innerHTML = `<div class="p-3 text-xs font-semibold text-gray-400 text-center">No exact match in DB. You can still add manually.</div>`;
                box.classList.remove('hidden');
            }
        };

        // 3. Select Product from DB
        window.selectProduct = function(name, unit, buy, sell, mrp) {
            document.getElementById('searchInput').value = name;
            document.getElementById('suggestionBox').classList.add('hidden');
            
            document.getElementById('unitType').value = unit || 'Kg';
            document.getElementById('buyPrice').value = buy || '';
            document.getElementById('sellPrice').value = sell || '';
            document.getElementById('mrpPrice').value = mrp || '';
            
            document.getElementById('quantity').focus();
        };

        // Hide suggestions on outside click
        document.addEventListener('click', function(event) {
            const searchInput = document.getElementById('searchInput');
            const suggestionBox = document.getElementById('suggestionBox');
            if (!searchInput.contains(event.target) && !suggestionBox.contains(event.target)) {
                suggestionBox.classList.add('hidden');
            }
        });

        // 4. Calculate Totals live
        window.calculateTotals = function() {
            const qty = parseFloat(document.getElementById('quantity').value) || 0;
            const buyUnit = parseFloat(document.getElementById('buyPrice').value) || 0;
            const sellUnit = parseFloat(document.getElementById('sellPrice').value) || 0;
            const mrpUnit = parseFloat(document.getElementById('mrpPrice').value) || 0;
            
            document.getElementById('totalBuyDisplay').innerText = `₹ ${(qty * buyUnit).toFixed(2)}`;
            document.getElementById('totalSellDisplay').innerText = `₹ ${(qty * sellUnit).toFixed(2)}`;
            document.getElementById('totalMrpDisplay').innerText = `₹ ${(qty * mrpUnit).toFixed(2)}`;
        };

        // 5. Lock/Unlock Header Info
        window.lockBillInfo = function(lock) {
            const fields = ['entryDate', 'billNo', 'branchSelect'];
            fields.forEach(id => {
                const el = document.getElementById(id);
                el.disabled = lock;
                if(lock) el.classList.add('opacity-70', 'cursor-not-allowed');
                else el.classList.remove('opacity-70', 'cursor-not-allowed');
            });
        };

        // 6. Clear Entry Fields
        window.clearProductInputs = function() {
            document.getElementById('searchInput').value = '';
            document.getElementById('quantity').value = '';
            document.getElementById('buyPrice').value = '';
            document.getElementById('sellPrice').value = '';
            document.getElementById('mrpPrice').value = '';
            calculateTotals();
        };

        // 7. Add to Bill Array
        window.addProductToBill = function() {
            const branch = document.getElementById('branchSelect').value;
            const name = document.getElementById('searchInput').value.trim();
            const unit = document.getElementById('unitType').value;
            const qty = parseFloat(document.getElementById('quantity').value);
            
            const buyPrice = parseFloat(document.getElementById('buyPrice').value);
            const sellPrice = parseFloat(document.getElementById('sellPrice').value) || 0;
            const mrpPrice = parseFloat(document.getElementById('mrpPrice').value) || 0;

            if(!branch) { alert("Please select a Branch first!"); return; }
            if(!name || !qty || isNaN(qty) || isNaN(buyPrice)) {
                alert("Please enter Product Name, Quantity, and Buy Price!");
                return;
            }

            const totalBuy = parseFloat((qty * buyPrice).toFixed(2));
            const totalSell = parseFloat((qty * sellPrice).toFixed(2));
            const totalMrp = parseFloat((qty * mrpPrice).toFixed(2));

            const productObj = { name, unit, qty, buyPrice, sellPrice, mrpPrice, totalBuy, totalSell, totalMrp };
            
            window.billItems.push(productObj);
            
            lockBillInfo(true);
            clearProductInputs();
            renderCart();
        };

        // 8. Delete from Array
        window.deleteProduct = function(index) {
            window.billItems.splice(index, 1);
            renderCart();
        };

        // 9. Render Cart
        window.renderCart = function() {
            const listContainer = document.getElementById('productList');
            const summarySection = document.getElementById('billSummarySection');
            listContainer.innerHTML = '';

            if (window.billItems.length === 0) {
                summarySection.classList.add('hidden');
                lockBillInfo(false);
                return;
            }

            summarySection.classList.remove('hidden');
            let grandTotal = 0;

            window.billItems.forEach((item, index) => {
                grandTotal += item.totalBuy;
                const div = document.createElement('div');
                div.className = "bg-gray-50 p-3 rounded-xl border border-gray-100 flex justify-between items-center";
                div.innerHTML = `
                    <div class="flex-1 pr-2">
                        <h4 class="text-sm font-bold text-gray-800 mb-1">${item.name}</h4>
                        <div class="flex gap-2 text-[9px] font-semibold text-gray-500 uppercase">
                            <span class="bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded">Qty: ${item.qty} ${item.unit}</span>
                            <span class="bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded">Total: ₹${item.totalBuy.toFixed(2)}</span>
                        </div>
                    </div>
                    <button onclick="deleteProduct(${index})" class="text-red-500 bg-red-100 w-8 h-8 rounded-lg flex items-center justify-center hover:bg-red-200 transition">
                        <i class="fas fa-trash text-xs"></i>
                    </button>
                `;
                listContainer.appendChild(div);
            });

            document.getElementById('grandTotal').innerText = grandTotal.toFixed(2);
            document.getElementById('itemCountBadge').innerText = `${window.billItems.length} Items`;
        };

        // 10. Save Full Bill to Firebase
        window.saveFullBill = async function() {
            if(window.billItems.length === 0) return;
            
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin text-lg"></i> Saving...';
            btn.disabled = true;

            const branchName = document.getElementById('branchSelect').value;
            const billNo = document.getElementById('billNo').value || "";
            const entryDate = document.getElementById('entryDate').value;
            const grandTotal = parseFloat(document.getElementById('grandTotal').innerText);

            try {
                // Save Bill Data to a new collection 'branch_bills'
                await addDoc(collection(db, "branch_bills"), {
                    branchName: branchName,
                    billNo: billNo,
                    date: entryDate,
                    grandTotalBuy: grandTotal,
                    items: window.billItems,
                    timestamp: serverTimestamp()
                });

                alert(`✅ Bill for ${branchName} saved successfully!`);
                
                // Reset everything
                window.billItems = [];
                renderCart();
                document.getElementById('billNo').value = '';
                lockBillInfo(false);
                document.getElementById('branchSelect').value = '';
                
            } catch (error) {
                console.error("Error saving bill:", error);
                alert("❌ Problem saving bill!");
            }

            btn.innerHTML = '<i class="fas fa-save text-lg"></i> Save Complete Bill';
            btn.disabled = false;
        };

        window.onload = function() {
            window.loadData();
        };
    </script>
</body>
</html>
