<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Entry - SDF STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f3f4f6; font-family: sans-serif; margin: 0; }
        .app-container { 
            max-width: 480px; 
            margin: 0 auto; 
            background-color: #ffffff; 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            position: relative; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
        }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- Header -->
        <div class="bg-indigo-600 text-white p-4 flex justify-between items-center shadow-md sticky top-0 z-30">
            <a href="store.html" class="text-xl focus:outline-none hover:text-indigo-200"><i class="fas fa-arrow-left"></i></a>
            <h1 class="text-xl font-bold tracking-wider">ADD PRODUCT</h1>
            <div class="w-6"></div>
        </div>

        <div class="p-4 flex-1">
            
            <!-- STEP 1: Basic Information -->
            <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100 mb-4">
                <div class="grid grid-cols-2 gap-3 mb-2">
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase">Entry Date</label>
                        <input type="date" id="entryDate" class="w-full border border-gray-300 p-2 rounded-lg text-sm bg-white outline-none" onchange="loadProductsByDate()">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase">Supplier (Optional)</label>
                        <input type="text" id="supplierName" placeholder="Supplier Name" class="w-full border border-gray-300 p-2 rounded-lg text-sm outline-none">
                    </div>
                </div>
            </div>

            <hr class="border-gray-200 mb-4">

            <!-- STEP 2: Product Entry -->
            <div id="productEntrySection">
                <div class="mb-3">
                    <label class="text-[10px] font-bold text-gray-500 uppercase mb-1 block">Product Name</label>
                    <input type="text" id="productName" placeholder="Enter product name..." class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:border-indigo-500 text-sm" autocomplete="off">
                </div>

                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase">Unit Type</label>
                        <select id="unitType" class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:border-indigo-500 text-sm">
                            <option value="Kg">Kg</option>
                            <option value="Gram">Gram</option>
                            <option value="Pack">Pack</option>
                            <option value="Box">Box</option>
                            <option value="Piece">Piece</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase">Total Quantity</label>
                        <input type="number" id="quantity" placeholder="Qty" class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:border-indigo-500 text-sm" oninput="calculateTotals()">
                    </div>
                </div>

                <!-- Per Unit Prices (3 Colored Boxes) -->
                <div class="grid grid-cols-3 gap-2 mb-2">
                    <div class="bg-blue-50 p-2 rounded-lg border border-blue-200">
                        <label class="text-[9px] font-bold text-blue-700 uppercase block mb-1">Buy / Unit <span class="text-red-500">*</span></label>
                        <input type="number" id="purchasePriceUnit" placeholder="₹ Buy" class="w-full border border-blue-300 p-1.5 rounded focus:outline-none focus:border-blue-500 text-xs bg-white" oninput="calculateTotals()">
                    </div>
                    <div class="bg-green-50 p-2 rounded-lg border border-green-200">
                        <label class="text-[9px] font-bold text-green-700 uppercase block mb-1">Sell / Unit</label>
                        <input type="number" id="sellingPriceUnit" placeholder="₹ Sell" class="w-full border border-green-300 p-1.5 rounded focus:outline-none focus:border-green-500 text-xs bg-white" oninput="calculateTotals()">
                    </div>
                    <div class="bg-purple-50 p-2 rounded-lg border border-purple-200">
                        <label class="text-[9px] font-bold text-purple-700 uppercase block mb-1">MRP / Unit</label>
                        <input type="number" id="mrpUnit" placeholder="₹ MRP" class="w-full border border-purple-300 p-1.5 rounded focus:outline-none focus:border-purple-500 text-xs bg-white" oninput="calculateTotals()">
                    </div>
                </div>

                <!-- Total Calculated Display (3 Colored Boxes) -->
                <div class="grid grid-cols-3 gap-2 mb-4">
                    <div class="bg-blue-100 p-2 rounded-lg border border-blue-300 text-center">
                        <span class="block text-[9px] font-bold text-blue-600 uppercase">Total Buy</span>
                        <span class="block text-xs font-bold text-blue-800 mt-1" id="totalPurchaseDisplay">₹ 0.00</span>
                    </div>
                    <div class="bg-green-100 p-2 rounded-lg border border-green-300 text-center">
                        <span class="block text-[9px] font-bold text-green-600 uppercase">Total Sell</span>
                        <span class="block text-xs font-bold text-green-800 mt-1" id="totalSellDisplay">₹ 0.00</span>
                    </div>
                    <div class="bg-purple-100 p-2 rounded-lg border border-purple-300 text-center">
                        <span class="block text-[9px] font-bold text-purple-600 uppercase">Total MRP</span>
                        <span class="block text-xs font-bold text-purple-800 mt-1" id="totalMrpDisplay">₹ 0.00</span>
                    </div>
                </div>

                <!-- DIRECT SAVE BUTTON -->
                <button onclick="saveSingleProduct()" id="saveProductBtn" type="button" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg transform transition hover:scale-105 active:scale-95 flex justify-center items-center gap-2">
                    <i class="fas fa-plus-circle"></i> Save Product to Database
                </button>
            </div>

            <hr class="border-gray-200 my-6">

            <!-- Added Products List for the Selected Date -->
            <div>
                <h3 class="text-xs font-bold text-gray-600 uppercase mb-3 flex justify-between">
                    <span>Products Added on <span id="displayDate" class="text-indigo-600">Today</span></span>
                </h3>
                <div id="datewiseProductList" class="flex flex-col gap-3">
                    <!-- Data will load here dynamically -->
                    <p class="text-xs text-gray-400 text-center italic">No products added for this date yet.</p>
                </div>
            </div>
            
            <div class="h-10"></div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9-KJ4UGuqjqca8yBZItdp6FmESI4qGGY",
            authDomain: "sdf-store-f39bd.firebaseapp.com",
            projectId: "sdf-store-f39bd",
            storageBucket: "sdf-store-f39bd.firebasestorage.app",
            messagingSenderId: "988561141451",
            appId: "1:988561141451:web:5778ab813d980c3f6df54e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Save Single Product Directly
        window.saveSingleProduct = async function() {
            const date = document.getElementById('entryDate').value;
            const supplier = document.getElementById('supplierName').value || "N/A";
            const name = document.getElementById('productName').value.trim();
            const unit = document.getElementById('unitType').value;
            const qty = parseFloat(document.getElementById('quantity').value);
            
            const buyUnit = parseFloat(document.getElementById('purchasePriceUnit').value);
            const sellUnit = parseFloat(document.getElementById('sellingPriceUnit').value) || 0;
            const mrpUnit = parseFloat(document.getElementById('mrpUnit').value) || 0;

            if(!name || !qty || isNaN(qty) || isNaN(buyUnit)) {
                alert("Please enter Product Name, Quantity, and Buy Price!");
                return;
            }

            const totalBuy = parseFloat((qty * buyUnit).toFixed(2));
            const btn = document.getElementById('saveProductBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            try {
                // Save directly to 'inventory_purchases' collection
                await addDoc(collection(db, "inventory_purchases"), {
                    date: date,
                    supplierName: supplier,
                    productName: name,
                    unit: unit,
                    quantity: qty,
                    buyPricePerUnit: buyUnit,
                    sellPricePerUnit: sellUnit,
                    mrpPerUnit: mrpUnit,
                    totalPurchasePrice: totalBuy,
                    timestamp: serverTimestamp()
                });

                alert("✅ Product Added Successfully!");
                clearProductInputs();
                loadProductsByDate(); // Refresh the list below

            } catch (error) {
                console.error("Error saving product:", error);
                alert("❌ Problem saving product!");
            }

            btn.innerHTML = '<i class="fas fa-plus-circle"></i> Save Product to Database';
            btn.disabled = false;
        };

        // Fetch products for selected date
        window.loadProductsByDate = async function() {
            const selectedDate = document.getElementById('entryDate').value;
            document.getElementById('displayDate').innerText = selectedDate;
            const listContainer = document.getElementById('datewiseProductList');
            
            listContainer.innerHTML = '<p class="text-xs text-indigo-400 text-center"><i class="fas fa-spinner fa-spin"></i> Loading...</p>';

            try {
                const q = query(collection(db, "inventory_purchases"), where("date", "==", selectedDate));
                const querySnapshot = await getDocs(q);
                
                listContainer.innerHTML = '';
                
                if(querySnapshot.empty) {
                    listContainer.innerHTML = '<p class="text-xs text-gray-400 text-center italic">No products added for this date yet.</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const item = doc.data();
                    const div = document.createElement('div');
                    div.className = "bg-white p-3 rounded-xl border border-gray-200 shadow-sm";
                    div.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h4 class="text-sm font-bold text-gray-800">${item.productName}</h4>
                                <p class="text-[10px] text-gray-500 font-medium mt-0.5">Supplier: ${item.supplierName}</p>
                            </div>
                            <span class="bg-indigo-100 text-indigo-700 text-[10px] font-bold px-2 py-1 rounded">Qty: ${item.quantity} ${item.unit}</span>
                        </div>
                        <div class="grid grid-cols-3 gap-2 mt-2 pt-2 border-t border-gray-100 text-center">
                            <div>
                                <span class="block text-[9px] text-blue-500 uppercase">Buy/Unit</span>
                                <span class="block text-xs font-bold text-gray-800">₹${item.buyPricePerUnit}</span>
                            </div>
                            <div>
                                <span class="block text-[9px] text-green-500 uppercase">Sell/Unit</span>
                                <span class="block text-xs font-bold text-gray-800">₹${item.sellPricePerUnit}</span>
                            </div>
                            <div>
                                <span class="block text-[9px] text-purple-500 uppercase">Total Buy</span>
                                <span class="block text-xs font-bold text-blue-800">₹${item.totalPurchasePrice}</span>
                            </div>
                        </div>
                    `;
                    listContainer.appendChild(div);
                });

            } catch (error) {
                console.error("Error fetching date products:", error);
                listContainer.innerHTML = '<p class="text-xs text-red-400 text-center">Failed to load data.</p>';
            }
        };

        // Initialize date and load data on start
        window.onload = function() {
            document.getElementById('entryDate').valueAsDate = new Date();
            loadProductsByDate();
        };
    </script>

    <!-- UI Scripts -->
    <script>
        function calculateTotals() {
            const qty = parseFloat(document.getElementById('quantity').value) || 0;
            const buyUnit = parseFloat(document.getElementById('purchasePriceUnit').value) || 0;
            const sellUnit = parseFloat(document.getElementById('sellingPriceUnit').value) || 0;
            const mrpUnit = parseFloat(document.getElementById('mrpUnit').value) || 0;
            
            document.getElementById('totalPurchaseDisplay').innerText = `₹ ${(qty * buyUnit).toFixed(2)}`;
            document.getElementById('totalSellDisplay').innerText = `₹ ${(qty * sellUnit).toFixed(2)}`;
            document.getElementById('totalMrpDisplay').innerText = `₹ ${(qty * mrpUnit).toFixed(2)}`;
        }

        function clearProductInputs() {
            document.getElementById('productName').value = '';
            document.getElementById('quantity').value = '';
            document.getElementById('purchasePriceUnit').value = '';
            document.getElementById('sellingPriceUnit').value = '';
            document.getElementById('mrpUnit').value = '';
            calculateTotals(); 
        }
    </script>
</body>
</html>
