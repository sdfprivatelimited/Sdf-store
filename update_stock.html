<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Stock - SDF STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
        .app-container { 
            max-width: 480px; 
            margin: 0 auto; 
            background-color: #fafafa; 
            min-height: 100vh; 
            position: relative; 
            box-shadow: 0 0 20px rgba(0,0,0,0.05); 
        }
        ::-webkit-scrollbar { display: none; }
        .content-area { padding-bottom: 90px; } 
        /* Popup Animation */
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .popup-animate {
            animation: popIn 0.2s ease-out forwards;
        }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- Modern Slim Header -->
        <div class="bg-indigo-600 text-white py-3 px-4 flex justify-between items-center shadow-md sticky top-0 z-30 rounded-b-lg">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-lg focus:outline-none hover:text-indigo-200 transition"><i class="fas fa-arrow-left"></i></a>
                <h1 class="text-lg font-bold flex items-center gap-2">
                    Update Stock
                    <span class="text-[9px] font-semibold bg-indigo-500/50 text-indigo-50 px-2 py-0.5 rounded-full tracking-wider uppercase border border-indigo-400">Quick Edit</span>
                </h1>
            </div>
            <!-- Total count badge -->
            <div class="bg-white/20 px-2 py-1 rounded-lg text-xs font-bold" id="headerCount">
                <i class="fas fa-spinner fa-spin"></i>
            </div>
        </div>

        <div class="p-4 flex-1 content-area">
            
            <!-- Search / Filter -->
            <div class="relative mb-5">
                <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Search by product name..." class="w-full bg-white border border-gray-200 p-3 pl-9 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm shadow-sm transition" onkeyup="filterProducts()">
            </div>

            <!-- Products Container -->
            <div id="productsContainer" class="flex flex-col gap-3">
                <!-- Loading State -->
                <div class="flex flex-col items-center justify-center py-10 text-gray-400">
                    <i class="fas fa-circle-notch fa-spin text-3xl mb-3 text-indigo-500"></i>
                    <p class="text-sm font-semibold text-gray-500">Loading stock data...</p>
                </div>
            </div>

        </div>

        <!-- UPDATE STOCK POPUP MODAL (Hidden by default) -->
        <div id="stockPopup" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white w-full max-w-[360px] rounded-2xl shadow-2xl popup-animate flex flex-col">
                
                <!-- Popup Header -->
                <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-indigo-50 rounded-t-2xl">
                    <h2 class="text-sm font-bold text-indigo-700 flex items-center gap-2"><i class="fas fa-sync-alt"></i> Stock Adjustment</h2>
                    <button onclick="closeStockPopup()" class="text-gray-400 hover:text-red-500 transition text-lg"><i class="fas fa-times-circle"></i></button>
                </div>

                <!-- Popup Body -->
                <div class="p-5">
                    <input type="hidden" id="updateDocId">
                    <input type="hidden" id="currentBuyPrice">
                    
                    <div class="mb-4 text-center">
                        <h3 id="updateProductName" class="text-lg font-bold text-gray-800 mb-1">Product Name</h3>
                        <p class="text-xs text-gray-500">Current Stock: <span id="currentStockDisplay" class="font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded-md text-sm ml-1">0</span></p>
                    </div>

                    <div class="mb-5">
                        <label class="text-[10px] font-bold text-gray-500 uppercase mb-1 block">Adjustment Quantity <span id="updateUnitLabel" class="text-indigo-500"></span></label>
                        <input type="number" id="adjustmentQty" placeholder="Enter quantity to add/reduce..." class="w-full border border-gray-300 p-3 rounded-xl focus:outline-none focus:border-indigo-500 text-sm bg-gray-50 text-center font-bold">
                    </div>

                    <!-- Action Buttons -->
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="submitStockUpdate('add')" id="btnAddStock" class="bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs hover:bg-emerald-600 transition shadow-md flex justify-center items-center gap-2">
                            <i class="fas fa-plus-circle"></i> Add Stock
                        </button>
                        <button onclick="submitStockUpdate('reduce')" id="btnReduceStock" class="bg-rose-500 text-white font-bold py-3 rounded-xl text-xs hover:bg-rose-600 transition shadow-md flex justify-center items-center gap-2">
                            <i class="fas fa-minus-circle"></i> Reduce Stock
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Clean Footer -->
        <div class="fixed bottom-0 w-full max-w-[480px] bg-white border-t border-gray-100 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.05)] z-40 rounded-t-2xl">
            <div class="flex justify-between items-center px-10 py-3">
                <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600 transition">
                    <i class="fas fa-house-chimney mb-1 text-xl"></i>
                    <span class="text-[10px] font-bold tracking-wide">Home</span>
                </a>
                
                <a href="view_products.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-500 transition">
                    <i class="fas fa-boxes-stacked mb-1 text-xl"></i>
                    <span class="text-[10px] font-bold tracking-wide">Stock</span>
                </a>

                <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-500 transition">
                    <i class="fas fa-user-circle mb-1 text-xl"></i>
                    <span class="text-[10px] font-bold tracking-wide">Profile</span>
                </a>
            </div>
        </div>
        
    </div>

    <!-- Firebase Setup & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9-KJ4UGuqjqca8yBZItdp6FmESI4qGGY",
            authDomain: "sdf-store-f39bd.firebaseapp.com",
            projectId: "sdf-store-f39bd",
            storageBucket: "sdf-store-f39bd.firebasestorage.app",
            messagingSenderId: "988561141451",
            appId: "1:988561141451:web:5778ab813d980c3f6df54e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let allProducts = []; 

        // Fetch and display products
        window.loadStockProducts = async function() {
            const container = document.getElementById('productsContainer');
            
            try {
                const querySnapshot = await getDocs(collection(db, "inventory_purchases")); 
                allProducts = []; 
                let html = "";
                let count = 0;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    data.id = doc.id; 
                    allProducts.push(data);
                    count++;

                    // Determine if stock is low or out
                    let stockBadgeClass = "bg-indigo-100 text-indigo-700";
                    if (data.quantity <= 0) stockBadgeClass = "bg-red-100 text-red-700 border border-red-200";
                    else if (data.quantity <= 5) stockBadgeClass = "bg-orange-100 text-orange-700 border border-orange-200";

                    html += `
                    <div class="product-card bg-white p-4 rounded-xl shadow-[0_2px_8px_-3px_rgba(0,0,0,0.05)] border border-gray-100 flex justify-between items-center">
                        <div class="flex-1 pr-2">
                            <h3 class="font-bold text-gray-800 text-sm productNameText mb-1">${data.productName}</h3>
                            <div class="flex items-center gap-2">
                                <span class="${stockBadgeClass} text-[10px] font-bold px-2 py-0.5 rounded">
                                    Stock: ${data.quantity} ${data.unit}
                                </span>
                                <span class="text-[9px] text-gray-400 font-semibold">Buy: ₹${data.buyPricePerUnit}</span>
                            </div>
                        </div>
                        
                        <button onclick="openStockPopup('${data.id}')" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 p-3 rounded-xl transition flex flex-col items-center justify-center shadow-sm border border-indigo-100">
                            <i class="fas fa-sync-alt text-sm mb-1"></i>
                            <span class="text-[9px] font-bold uppercase tracking-wider">Update</span>
                        </button>
                    </div>
                    `;
                });

                if (count === 0) {
                    html = `
                    <div class="text-center py-10">
                        <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3 text-gray-300 text-2xl">
                            <i class="fas fa-box-open"></i>
                        </div>
                        <h3 class="text-sm font-bold text-gray-600">No Products Found</h3>
                        <p class="text-xs text-gray-400 mt-1">Add some products from the dashboard.</p>
                    </div>`;
                }

                container.innerHTML = html;
                document.getElementById('headerCount').innerText = `${count} Items`;

            } catch (error) {
                console.error("Error fetching products: ", error);
                container.innerHTML = `<p class="text-center text-red-500 text-sm mt-5"><i class="fas fa-exclamation-triangle"></i> Failed to load data.</p>`;
                document.getElementById('headerCount').innerText = `Error`;
            }
        };

        // --- POPUP UPDATE LOGIC ---

        window.openStockPopup = function(docId) {
            const product = allProducts.find(p => p.id === docId);
            if (!product) return;

            document.getElementById('updateDocId').value = product.id;
            document.getElementById('currentBuyPrice').value = product.buyPricePerUnit || 0;
            
            document.getElementById('updateProductName').innerText = product.productName;
            document.getElementById('currentStockDisplay').innerText = `${product.quantity} ${product.unit}`;
            document.getElementById('updateUnitLabel').innerText = `(${product.unit})`;
            
            document.getElementById('adjustmentQty').value = '';
            
            // Store current quantity temporarily in a global variable for calculation
            window.currentEditingQty = parseFloat(product.quantity) || 0;
            window.currentEditingUnit = product.unit;

            document.getElementById('stockPopup').classList.remove('hidden');
        };

        window.closeStockPopup = function() {
            document.getElementById('stockPopup').classList.add('hidden');
        };

        window.submitStockUpdate = async function(type) {
            const docId = document.getElementById('updateDocId').value;
            const adjustmentInput = document.getElementById('adjustmentQty').value;
            const adjQty = parseFloat(adjustmentInput);
            const buyPrice = parseFloat(document.getElementById('currentBuyPrice').value);

            if (!adjustmentInput || isNaN(adjQty) || adjQty <= 0) {
                alert("Please enter a valid quantity greater than 0!");
                return;
            }

            let newQty = window.currentEditingQty;

            if (type === 'add') {
                newQty += adjQty;
            } else if (type === 'reduce') {
                if (adjQty > newQty) {
                    alert(`Not enough stock! You only have ${newQty} ${window.currentEditingUnit} available.`);
                    return;
                }
                newQty -= adjQty;
            }

            // Calculate new total value
            const newTotalValue = parseFloat((newQty * buyPrice).toFixed(2));

            // Button Loading State
            const btnId = type === 'add' ? 'btnAddStock' : 'btnReduceStock';
            const btn = document.getElementById(btnId);
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';
            btn.disabled = true;

            try {
                const productRef = doc(db, "inventory_purchases", docId);
                await updateDoc(productRef, {
                    quantity: newQty,
                    totalPurchasePrice: newTotalValue
                });

                alert(`✅ Stock updated successfully! New Stock: ${newQty} ${window.currentEditingUnit}`);
                closeStockPopup();
                window.loadStockProducts(); // Refresh list

            } catch (error) {
                console.error("Error updating stock: ", error);
                alert("❌ Failed to update stock.");
            }

            // Restore button
            btn.innerHTML = originalHtml;
            btn.disabled = false;
        };

        // Search Filter Logic
        window.filterProducts = function() {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const cards = document.getElementsByClassName("product-card");
            const names = document.getElementsByClassName("productNameText");

            for (let i = 0; i < cards.length; i++) {
                let nameValue = names[i].innerText || names[i].textContent;
                if (nameValue.toLowerCase().indexOf(input) > -1) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        };

        window.onload = function() {
            window.loadStockProducts();
        };
    </script>
</body>
          </html>
