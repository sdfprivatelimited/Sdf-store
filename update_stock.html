<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Stock - SDF STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
        .app-container { 
            max-width: 480px; 
            margin: 0 auto; 
            background-color: #fafafa; 
            min-height: 100vh; 
            position: relative; 
            box-shadow: 0 0 20px rgba(0,0,0,0.05); 
            display: flex;
            flex-direction: column;
        }
        ::-webkit-scrollbar { display: none; }
        .content-area { padding-bottom: 90px; flex: 1; display: flex; flex-direction: column; }
        /* Smooth expand animation */
        .expand-anim {
            animation: expandBox 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes expandBox {
            0% { transform: scale(0.95) translateY(10px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- Modern Slim Header -->
        <div class="bg-indigo-600 text-white py-3 px-4 flex justify-between items-center shadow-md sticky top-0 z-30 rounded-b-lg">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-lg focus:outline-none hover:text-indigo-200 transition"><i class="fas fa-arrow-left"></i></a>
                <h1 class="text-lg font-bold flex items-center gap-2">
                    Update Stock
                </h1>
            </div>
            <!-- Loading Status -->
            <div class="bg-white/20 px-2 py-1 rounded-lg text-[10px] font-bold" id="dbStatus">
                <i class="fas fa-spinner fa-spin"></i> Loading...
            </div>
        </div>

        <div class="p-4 content-area justify-center items-center">
            
            <!-- 1. Centered Search Box Section -->
            <div id="searchSection" class="w-full max-w-sm transition-all duration-300">
                <div class="text-center mb-6">
                    <div class="w-16 h-16 bg-indigo-100 text-indigo-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-3 shadow-inner">
                        <i class="fas fa-search-plus"></i>
                    </div>
                    <h2 class="text-xl font-bold text-gray-800">Find Product</h2>
                    <p class="text-xs text-gray-400 mt-1">Type name to update stock instantly</p>
                </div>

                <div class="relative z-20">
                    <input type="text" id="searchInput" placeholder="Enter product name..." class="w-full bg-white border-2 border-indigo-200 py-4 px-5 rounded-2xl focus:outline-none focus:border-indigo-600 shadow-lg transition font-bold text-base text-indigo-900 placeholder-gray-400 text-center" oninput="showSuggestions(this.value)" autocomplete="off">
                    
                    <!-- Suggestions Dropdown -->
                    <div id="suggestionBox" class="hidden absolute w-full bg-white border border-gray-100 rounded-2xl mt-2 shadow-2xl max-h-64 overflow-y-auto top-full left-0 z-50">
                        <!-- Data injected via JS -->
                    </div>
                </div>
            </div>

            <!-- 2. Expanded Product Update Card (Hidden initially) -->
            <div id="updateCardSection" class="hidden w-full max-w-sm bg-white rounded-3xl shadow-2xl border border-gray-100 p-6 expand-anim relative overflow-hidden">
                
                <button onclick="resetSearch()" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 text-xl transition"><i class="fas fa-times-circle"></i></button>

                <input type="hidden" id="selectedDocId">
                <input type="hidden" id="selectedBuyPrice">

                <div class="text-center mb-5 mt-2">
                    <span class="bg-indigo-100 text-indigo-600 text-[10px] font-bold px-2 py-1 rounded-md uppercase tracking-wider mb-2 inline-block">Editing Stock</span>
                    <h3 id="cardProductName" class="text-xl font-extrabold text-gray-800 leading-tight">Product Name</h3>
                </div>

                <!-- Price & Stock Info -->
                <div class="bg-gray-50 rounded-2xl p-4 mb-5 border border-gray-100">
                    <div class="flex justify-between items-center mb-3 pb-3 border-b border-gray-200">
                        <span class="text-xs font-bold text-gray-500 uppercase">Current Stock</span>
                        <span id="cardCurrentStock" class="text-lg font-black text-indigo-600">0 Kg</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4 text-center">
                        <div>
                            <span class="block text-[9px] font-bold text-blue-500 uppercase">Buy Price</span>
                            <span id="cardBuyPrice" class="block text-sm font-bold text-gray-700">₹0</span>
                        </div>
                        <div>
                            <span class="block text-[9px] font-bold text-green-500 uppercase">Sell Price</span>
                            <span id="cardSellPrice" class="block text-sm font-bold text-gray-700">₹0</span>
                        </div>
                    </div>
                </div>

                <!-- Input for Adjustment -->
                <div class="mb-5">
                    <label class="text-[10px] font-bold text-gray-500 uppercase mb-2 block text-center">Enter Stock Amount</label>
                    <div class="relative flex items-center justify-center">
                        <input type="number" id="adjustmentQty" placeholder="0" class="w-full border-2 border-indigo-200 py-3 rounded-xl focus:outline-none focus:border-indigo-600 text-2xl bg-white text-center font-black text-gray-800 shadow-inner">
                        <span id="cardUnitLabel" class="absolute right-4 text-sm font-bold text-gray-400"></span>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-3">
                    <button onclick="submitStock('add')" id="btnAdd" class="flex-1 bg-emerald-500 text-white font-bold py-3.5 rounded-xl text-sm hover:bg-emerald-600 transition shadow-lg shadow-emerald-500/30 flex justify-center items-center gap-2 transform active:scale-95">
                        <i class="fas fa-plus"></i> Add
                    </button>
                    <button onclick="submitStock('reduce')" id="btnReduce" class="bg-white border-2 border-rose-100 text-rose-500 font-bold py-3.5 px-4 rounded-xl text-sm hover:bg-rose-50 transition flex justify-center items-center gap-2 transform active:scale-95">
                        <i class="fas fa-minus"></i>
                    </button>
                </div>

            </div>

        </div>

        <!-- Clean Footer -->
        <div class="fixed bottom-0 w-full max-w-[480px] bg-white border-t border-gray-100 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.05)] z-40 rounded-t-2xl">
            <div class="flex justify-between items-center px-10 py-3">
                <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600 transition">
                    <i class="fas fa-house-chimney mb-1 text-xl"></i>
                    <span class="text-[10px] font-bold tracking-wide">Home</span>
                </a>
                
                <a href="view_products.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-500 transition">
                    <i class="fas fa-boxes-stacked mb-1 text-xl"></i>
                    <span class="text-[10px] font-bold tracking-wide">Stock</span>
                </a>

                <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-500 transition">
                    <i class="fas fa-user-circle mb-1 text-xl"></i>
                    <span class="text-[10px] font-bold tracking-wide">Profile</span>
                </a>
            </div>
        </div>
        
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9-KJ4UGuqjqca8yBZItdp6FmESI4qGGY",
            authDomain: "sdf-store-f39bd.firebaseapp.com",
            projectId: "sdf-store-f39bd",
            storageBucket: "sdf-store-f39bd.firebasestorage.app",
            messagingSenderId: "988561141451",
            appId: "1:988561141451:web:5778ab813d980c3f6df54e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let allProducts = []; 

        // 1. Fetch All Data on Load
        window.loadData = async function() {
            try {
                const querySnapshot = await getDocs(collection(db, "inventory_purchases")); 
                allProducts = []; 
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    data.id = doc.id; 
                    allProducts.push(data);
                });
                document.getElementById('dbStatus').innerHTML = `<i class="fas fa-check-circle text-green-300"></i> Ready`;
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('dbStatus').innerHTML = `<i class="fas fa-times-circle text-red-300"></i> Error`;
            }
        };

        // 2. Search Autocomplete
        window.showSuggestions = function(value) {
            const box = document.getElementById('suggestionBox');
            
            if (!value.trim()) {
                box.classList.add('hidden');
                return;
            }

            const filtered = allProducts.filter(p => p.productName.toLowerCase().includes(value.toLowerCase()));
            
            if (filtered.length > 0) {
                box.innerHTML = filtered.map(p => {
                    let qty = parseFloat(p.quantity) || 0;
                    let qtyColor = qty <= 0 ? 'text-red-500 bg-red-50' : 'text-indigo-600 bg-indigo-50';
                    return `
                    <div onclick="selectProduct('${p.id}')" class="p-4 border-b border-gray-50 hover:bg-gray-50 cursor-pointer flex justify-between items-center transition">
                        <span class="text-sm font-bold text-gray-800">${p.productName}</span>
                        <span class="text-[10px] font-black ${qtyColor} px-2 py-1 rounded-md">Stock: ${qty} ${p.unit}</span>
                    </div>
                `}).join('');
                box.classList.remove('hidden');
            } else {
                box.innerHTML = `<div class="p-4 text-xs font-semibold text-gray-400 text-center">No product found</div>`;
                box.classList.remove('hidden');
            }
        };

        // 3. Select Product & Show Card
        window.selectProduct = function(docId) {
            const product = allProducts.find(p => p.id === docId);
            if (!product) return;

            // Hide search, show card
            document.getElementById('searchSection').classList.add('hidden');
            document.getElementById('suggestionBox').classList.add('hidden');
            
            // Fill Data
            document.getElementById('selectedDocId').value = product.id;
            document.getElementById('selectedBuyPrice').value = product.buyPricePerUnit || 0;
            
            document.getElementById('cardProductName').innerText = product.productName;
            
            let qty = parseFloat(product.quantity) || 0;
            document.getElementById('cardCurrentStock').innerText = `${qty} ${product.unit}`;
            if(qty <= 0) document.getElementById('cardCurrentStock').classList.replace('text-indigo-600', 'text-red-600');
            else document.getElementById('cardCurrentStock').classList.replace('text-red-600', 'text-indigo-600');

            document.getElementById('cardBuyPrice').innerText = `₹${product.buyPricePerUnit || 0}`;
            document.getElementById('cardSellPrice').innerText = `₹${product.sellPricePerUnit || 0}`;
            document.getElementById('cardUnitLabel').innerText = product.unit;
            
            document.getElementById('adjustmentQty').value = '';
            
            window.currentEditingQty = qty;
            window.currentEditingUnit = product.unit;

            document.getElementById('updateCardSection').classList.remove('hidden');
            
            // Auto focus input
            setTimeout(() => document.getElementById('adjustmentQty').focus(), 300);
        };

        // 4. Back to search
        window.resetSearch = function() {
            document.getElementById('updateCardSection').classList.add('hidden');
            document.getElementById('searchSection').classList.remove('hidden');
            document.getElementById('searchInput').value = '';
            document.getElementById('searchInput').focus();
        };

        // 5. Submit Update
        window.submitStock = async function(type) {
            const docId = document.getElementById('selectedDocId').value;
            const inputVal = document.getElementById('adjustmentQty').value;
            const adjQty = parseFloat(inputVal);
            const buyPrice = parseFloat(document.getElementById('selectedBuyPrice').value) || 0;

            if (!inputVal || isNaN(adjQty) || adjQty <= 0) {
                alert("Please enter a valid stock amount!");
                return;
            }

            let newQty = window.currentEditingQty;

            if (type === 'add') {
                newQty += adjQty;
            } else if (type === 'reduce') {
                if (adjQty > newQty) {
                    alert(`Not enough stock! You only have ${newQty} ${window.currentEditingUnit}.`);
                    return;
                }
                newQty -= adjQty;
            }

            const newTotalValue = parseFloat((newQty * buyPrice).toFixed(2));

            const btnId = type === 'add' ? 'btnAdd' : 'btnReduce';
            const btn = document.getElementById(btnId);
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            try {
                const productRef = doc(db, "inventory_purchases", docId);
                await updateDoc(productRef, {
                    quantity: newQty,
                    totalPurchasePrice: newTotalValue
                });

                // Update local array so immediate re-search shows updated stock
                const pIndex = allProducts.findIndex(p => p.id === docId);
                if(pIndex > -1) {
                    allProducts[pIndex].quantity = newQty;
                    allProducts[pIndex].totalPurchasePrice = newTotalValue;
                }

                alert(`✅ Stock Updated!\nNew Stock is: ${newQty} ${window.currentEditingUnit}`);
                resetSearch();

            } catch (error) {
                console.error("Error updating stock: ", error);
                alert("❌ Failed to update stock. Try again.");
            }

            btn.innerHTML = originalHtml;
            btn.disabled = false;
        };

        // Hide suggestions on outside click
        document.addEventListener('click', function(event) {
            const searchInput = document.getElementById('searchInput');
            const suggestionBox = document.getElementById('suggestionBox');
            if (!searchInput.contains(event.target) && !suggestionBox.contains(event.target)) {
                suggestionBox.classList.add('hidden');
            }
        });

        window.onload = function() {
            window.loadData();
        };
    </script>
</body>
</html>
