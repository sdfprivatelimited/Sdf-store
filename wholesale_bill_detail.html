<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Sheet Details - SDF STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f3f4f6; font-family: sans-serif; margin: 0; }
        .app-container { max-width: 480px; margin: 0 auto; background-color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #d1d5db; padding: 6px; text-align: left; font-size: 11px; }
        th { background-color: #f3f4f6; font-weight: bold; color: #374151; }
        td { color: #1f2937; font-weight: 500; }
        tr:nth-child(even) { background-color: #f9fafb; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="bg-indigo-600 text-white p-4 flex justify-between items-center shadow-md sticky top-0 z-50">
            <button onclick="window.history.back()" class="text-xl focus:outline-none hover:text-indigo-200"><i class="fas fa-arrow-left"></i></button>
            <h1 class="text-xl font-bold tracking-wider uppercase">Bill Details</h1>
            <div class="w-6"></div>
        </div>

        <div class="p-4 flex-1">
            <div id="loading" class="text-center mt-10 text-indigo-500 font-bold"><i class="fas fa-spinner fa-spin text-3xl mb-2"></i><p>Loading Data...</p></div>
            <div id="sheetView" class="hidden pb-10"></div>
        </div>
    </div>

    <!-- Firebase & WhatsApp Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9-KJ4UGuqjqca8yBZItdp6FmESI4qGGY",
            authDomain: "sdf-store-f39bd.firebaseapp.com",
            projectId: "sdf-store-f39bd",
            storageBucket: "sdf-store-f39bd.firebasestorage.app",
            messagingSenderId: "988561141451",
            appId: "1:988561141451:web:5778ab813d980c3f6df54e"
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        const billId = new URLSearchParams(window.location.search).get('id');

        async function loadData() {
            if (!billId) return;
            const docSnap = await getDoc(doc(db, "wholesale_bills", billId));
            if (docSnap.exists()) {
                document.getElementById('loading').style.display = 'none';
                window.currentBillData = docSnap.data(); // Save globally for WhatsApp
                renderData(window.currentBillData, billId);
            }
        }

        function renderData(data, currentBillId) {
            let displayDate = new Date(data.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            if (displayDate === "Invalid Date") displayDate = data.date || "N/A";

            let tableRows = '';
            if (data.items) {
                data.items.forEach((item, index) => {
                    let discount = item.discount ? `₹${item.discount}` : '-';
                    tableRows += `
                        <tr>
                            <td class="text-center">${index + 1}</td>
                            <td>${item.name}</td>
                            <td>${item.qty} ${item.unit}</td>
                            <td>₹${item.perUnitPrice}</td>
                            <td class="text-red-500">${discount}</td>
                            <td class="font-bold">₹${item.totalItemPrice}</td>
                        </tr>
                    `;
                });
            }

            let dueStatusHTML = data.paymentStatus === 'Due' ? `<span class="text-red-600">Due (Baki)</span>` : `<span class="text-green-600">Full Paid</span>`;

            document.getElementById('sheetView').innerHTML = `
                <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100 mb-4 shadow-sm">
                    <div class="grid grid-cols-2 gap-2 text-xs font-bold text-indigo-900 mb-2">
                        <p>Customer: <span class="text-gray-700">${data.customerName}</span></p>
                        <p class="text-right">Date: <span class="text-gray-700">${displayDate}</span></p>
                        <p>Bill No: <span class="text-gray-700">${data.billNo || 'N/A'}</span></p>
                        <p class="text-right">Status: ${dueStatusHTML}</p>
                    </div>
                </div>

                <h3 class="text-sm font-bold text-gray-800 uppercase mb-2"><i class="fas fa-table text-indigo-500"></i> Items Sheet</h3>
                
                <div class="overflow-x-auto mb-4 border border-gray-300 rounded-lg shadow-sm">
                    <table>
                        <thead>
                            <tr><th style="width: 30px;" class="text-center">#</th><th>Item Name</th><th>Qty</th><th>Price/Unit</th><th>Discount</th><th>Total Price</th></tr>
                        </thead>
                        <tbody>${tableRows}</tbody>
                    </table>
                </div>

                <div class="bg-white border border-gray-300 p-3 rounded-lg shadow-sm mb-5">
                    <div class="flex justify-between text-xs font-bold text-gray-700 mb-1"><span>Paid Amount:</span><span>₹${data.paidAmount}</span></div>
                    <div class="flex justify-between text-xs font-bold text-red-600 mb-2 pb-2 border-b border-gray-200"><span>Due Amount (Baki):</span><span>₹${data.dueAmount || 0}</span></div>
                    <div class="flex justify-between text-base font-bold text-green-700"><span>Grand Total:</span><span>₹${data.grandTotal}</span></div>
                </div>

                <!-- Action Buttons -->
                <div class="grid grid-cols-2 gap-3 mt-2">
                    <a href="thermal_print.html?id=${currentBillId}" class="block w-full text-center bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg transform transition hover:scale-105 active:scale-95">
                        <i class="fas fa-receipt text-xl mb-1 block"></i> Generate Bill
                    </a>
                    
                    <button onclick="sendWhatsApp()" class="block w-full text-center bg-green-500 text-white font-bold py-3 rounded-xl shadow-lg transform transition hover:scale-105 active:scale-95">
                        <i class="fab fa-whatsapp text-xl mb-1 block"></i> WhatsApp Bill
                    </button>
                </div>
            `;
            document.getElementById('sheetView').classList.remove('hidden');
        }

        // WhatsApp Share Function (Fixed for Android WebView)
        window.sendWhatsApp = function() {
            if (!window.currentBillData) return;
            const data = window.currentBillData;
            let displayDate = new Date(data.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            
            // Text Message Format for WhatsApp
            let msg = `*SDF STORE - Wholesale Bill*\n`;
            msg += `------------------------\n`;
            msg += `*Customer:* ${data.customerName}\n`;
            msg += `*Date:* ${displayDate}\n`;
            if (data.billNo) msg += `*Bill No:* ${data.billNo}\n`;
            msg += `------------------------\n`;
            
            if (data.items) {
                data.items.forEach((item, index) => {
                    msg += `${index + 1}. ${item.name} - ${item.qty} ${item.unit} = ₹${item.totalItemPrice}\n`;
                });
            }
            msg += `------------------------\n`;
            msg += `*Grand Total: ₹${data.grandTotal}*\n`;
            msg += `*Paid Amount:* ₹${data.paidAmount}\n`;
            
            if(data.paymentStatus === 'Due') {
                msg += `*Due Amount (Baki): ₹${data.dueAmount}*\n`;
            } else {
                msg += `*Status:* Full Paid ✅\n`;
            }
            msg += `\nThank you for your business!`;

            let encodedMsg = encodeURIComponent(msg);
            let phoneQuery = data.customerPhone ? `phone=91${data.customerPhone}&` : '';
            
            // Android Intent URL: এটি WebView কে বাধ্য করবে সরাসরি WhatsApp অ্যাপ খুলতে
            let intentUrl = `intent://send?${phoneQuery}text=${encodedMsg}#Intent;scheme=whatsapp;package=com.whatsapp;end;`;
            
            window.location.href = intentUrl;
        }

        window.onload = loadData;
    </script>
</body>
</html>
