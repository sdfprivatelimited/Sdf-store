<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wholesale Dashboard - SDF STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f3f4f6; font-family: sans-serif; margin: 0; }
        .app-container { 
            max-width: 480px; 
            margin: 0 auto; 
            background-color: #f8fafc; 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            position: relative; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
        }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- Header -->
        <div class="bg-indigo-600 text-white p-4 flex justify-between items-center shadow-md sticky top-0 z-30">
            <a href="index.html" class="text-xl focus:outline-none hover:text-indigo-200"><i class="fas fa-arrow-left"></i></a>
            <h1 class="text-xl font-bold tracking-wider">WHOLESALE</h1>
            <div class="w-6"></div>
        </div>

        <div class="p-5 flex-1">
            <h3 class="text-xs font-bold text-gray-500 uppercase mb-5 text-center mt-2">Manage Wholesale Bills</h3>
            
            <!-- Cards Section -->
            <div class="grid grid-cols-1 gap-5">
                
                <!-- 1. Entry Bill Card -->
                <a href="wholesale_form.html" class="bg-white p-5 rounded-2xl shadow-sm border border-indigo-200 flex items-center gap-4 transform transition hover:scale-105 active:scale-95">
                    <div class="bg-indigo-50 text-indigo-500 w-16 h-16 rounded-full flex items-center justify-center shadow-inner">
                        <i class="fas fa-file-invoice-dollar text-3xl"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-gray-800 uppercase">Entry Bill</h2>
                        <p class="text-xs text-gray-500 font-semibold mt-1">নতুন পাইকারি বিল এন্ট্রি করুন</p>
                    </div>
                </a>

                <!-- 2. Views Bill Card -->
                <a href="wholesale_views.html" class="bg-white p-5 rounded-2xl shadow-sm border border-green-200 flex items-center gap-4 transform transition hover:scale-105 active:scale-95">
                    <div class="bg-green-50 text-green-500 w-16 h-16 rounded-full flex items-center justify-center shadow-inner">
                        <i class="fas fa-list-alt text-3xl"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-gray-800 uppercase">Views Bill</h2>
                        <p class="text-xs text-gray-500 font-semibold mt-1">পুরনো সব পাইকারি বিল দেখুন</p>
                    </div>
                </a>

            </div>
        </div>
    </div>
</body>
</html>
