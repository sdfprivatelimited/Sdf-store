<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sangrampur Payment - SDF STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
        .app-container { 
            max-width: 480px; 
            margin: 0 auto; 
            background-color: #fafafa; 
            min-height: 100vh; 
            position: relative; 
            box-shadow: 0 0 20px rgba(0,0,0,0.05); 
            display: flex;
            flex-direction: column;
        }
        ::-webkit-scrollbar { display: none; }
        .content-area { padding-bottom: 90px; flex: 1; }
        .menu-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .menu-card:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- Modern Slim Header -->
        <div class="bg-indigo-600 text-white py-3 px-4 flex justify-between items-center shadow-md sticky top-0 z-30 rounded-b-lg">
            <div class="flex items-center gap-3">
                <a href="bill_payment_menu.html" class="text-lg focus:outline-none hover:text-indigo-200 transition"><i class="fas fa-arrow-left"></i></a>
                <h1 class="text-lg font-bold flex items-center gap-2 uppercase">
                    Sangrampur
                    <span class="text-[9px] font-semibold bg-indigo-500/50 text-indigo-50 px-2 py-0.5 rounded-full tracking-wider uppercase border border-indigo-400">Payment</span>
                </h1>
            </div>
            <button class="text-indigo-100 hover:text-white transition text-lg">
                <i class="fas fa-wallet"></i>
            </button>
        </div>

        <div class="p-4 content-area mt-2">
            
            <!-- Monthly Collection Display (Modernized) -->
            <div class="bg-gradient-to-br from-emerald-500 to-teal-600 rounded-3xl p-6 text-white shadow-[0_8px_20px_-3px_rgba(16,185,129,0.4)] relative overflow-hidden mb-6">
                <!-- Background decoration -->
                <div class="absolute -right-6 -bottom-6 bg-white/10 w-32 h-32 rounded-full blur-2xl"></div>
                <i class="fas fa-calendar-check absolute right-4 top-4 text-5xl text-white/10"></i>
                
                <p class="text-[10px] font-semibold text-emerald-100 uppercase mb-4 tracking-widest">This Month's Collection</p>
                
                <div class="flex justify-between items-end mb-4 relative z-10">
                    <div>
                        <p class="text-[10px] text-emerald-100 font-bold uppercase"><i class="fas fa-money-bill-wave text-green-200"></i> Cash</p>
                        <h3 class="text-xl font-bold">₹ <span id="monthCash">0.00</span></h3>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] text-emerald-100 font-bold uppercase"><i class="fas fa-mobile-alt text-blue-200"></i> Online</p>
                        <h3 class="text-xl font-bold">₹ <span id="monthOnline">0.00</span></h3>
                    </div>
                </div>
                
                <div class="border-t border-white/20 pt-3 mt-1 relative z-10">
                    <p class="text-[10px] text-emerald-100 font-bold uppercase tracking-wider">Total Collection</p>
                    <h2 class="text-3xl font-extrabold text-white tracking-tight">₹ <span id="monthTotal">0.00</span></h2>
                </div>
            </div>

            <!-- Daily Entry Form Box -->
            <div class="bg-white p-5 rounded-3xl shadow-[0_2px_15px_-3px_rgba(0,0,0,0.05)] border border-gray-100 mb-5">
                <h3 class="text-xs font-bold text-gray-700 uppercase mb-4 flex items-center gap-2">
                    <i class="fas fa-cash-register text-emerald-500"></i> Today's Collection Entry
                </h3>
                
                <form id="collectionForm" class="flex flex-col gap-4">
                    
                    <!-- Date -->
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase mb-1 block">Select Date</label>
                        <input type="date" id="entryDate" class="w-full border-2 border-gray-100 p-3 rounded-xl focus:outline-none focus:border-emerald-400 bg-gray-50 text-sm font-bold text-gray-700 transition" required>
                    </div>

                    <!-- Cash & Online -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-green-50 p-3 rounded-xl border border-green-100">
                            <label class="text-[10px] font-bold text-green-700 uppercase mb-1 block"><i class="fas fa-money-bill-wave"></i> Cash</label>
                            <div class="relative">
                                <span class="absolute left-2 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm">₹</span>
                                <input type="number" id="cashAmount" placeholder="0" class="w-full bg-white border border-green-200 p-2 pl-6 rounded-lg focus:outline-none focus:border-green-500 font-bold text-gray-800 text-center" oninput="calculateTotal()" required>
                            </div>
                        </div>
                        <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
                            <label class="text-[10px] font-bold text-blue-700 uppercase mb-1 block"><i class="fas fa-mobile-alt"></i> Online</label>
                            <div class="relative">
                                <span class="absolute left-2 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm">₹</span>
                                <input type="number" id="onlineAmount" placeholder="0" class="w-full bg-white border border-blue-200 p-2 pl-6 rounded-lg focus:outline-none focus:border-blue-500 font-bold text-gray-800 text-center" oninput="calculateTotal()" required>
                            </div>
                        </div>
                    </div>

                    <!-- Auto Total Display -->
                    <div class="bg-gray-800 p-4 rounded-xl flex justify-between items-center shadow-inner mt-1">
                        <span class="text-xs font-bold text-gray-300 uppercase tracking-widest">Total Today:</span>
                        <span class="text-xl font-bold text-emerald-400">₹ <span id="totalAmount">0.00</span></span>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submitBtn" class="menu-card w-full bg-emerald-600 text-white font-bold py-4 rounded-xl mt-2 shadow-lg shadow-emerald-500/30 flex justify-center items-center gap-2">
                        <i class="fas fa-paper-plane"></i> Submit Collection
                    </button>
                </form>
            </div>

            <!-- Views / History Button -->
            <a href="branch_views.html?branch=Sangrampur" class="menu-card w-full flex items-center justify-center bg-indigo-50 text-indigo-700 border border-indigo-100 font-bold py-4 rounded-xl shadow-sm gap-2">
                <i class="fas fa-history"></i> View Collection History
            </a>
            
        </div>

        <!-- Clean Footer (Home, Stock, Accounts) -->
        <div class="fixed bottom-0 w-full max-w-[480px] bg-white border-t border-gray-100 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.05)] z-40 rounded-t-2xl">
            <div class="flex justify-between items-center px-10 py-3">
                <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600 transition">
                    <i class="fas fa-house-chimney mb-1 text-xl"></i>
                    <span class="text-[10px] font-bold tracking-wide">Home</span>
                </a>
                
                <a href="view_products.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-500 transition">
                    <i class="fas fa-boxes-stacked mb-1 text-xl"></i>
                    <span class="text-[10px] font-bold tracking-wide">Stock</span>
                </a>

                <a href="bill_payment_menu.html" class="flex flex-col items-center text-indigo-600 transition">
                    <i class="fas fa-wallet mb-1 text-xl"></i>
                    <span class="text-[10px] font-bold tracking-wide">Accounts</span>
                </a>
            </div>
        </div>
        
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9-KJ4UGuqjqca8yBZItdp6FmESI4qGGY",
            authDomain: "sdf-store-f39bd.firebaseapp.com",
            projectId: "sdf-store-f39bd",
            storageBucket: "sdf-store-f39bd.firebasestorage.app",
            messagingSenderId: "988561141451",
            appId: "1:988561141451:web:5778ab813d980c3f6df54e",
            measurementId: "G-WH88QMN0Z5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 👉 CHANGE THIS NAME FOR OTHER BRANCHES
        const BRANCH_NAME = "Sangrampur"; 

        // 1. Fetch Current Month's Collection
        async function fetchMonthlyCollection() {
            try {
                const currentDate = new Date();
                const currentMonthString = currentDate.toISOString().slice(0, 7); 

                const q = query(
                    collection(db, "branch_daily_payments"), 
                    where("branchName", "==", BRANCH_NAME)
                );
                
                const querySnapshot = await getDocs(q);
                
                let monthTotalCash = 0;
                let monthTotalOnline = 0;
                let monthGrandTotal = 0;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.date && data.date.startsWith(currentMonthString)) {
                        monthTotalCash += parseFloat(data.cashAmount) || 0;
                        monthTotalOnline += parseFloat(data.onlineAmount) || 0;
                        monthGrandTotal += parseFloat(data.totalAmount) || 0;
                    }
                });

                document.getElementById('monthCash').innerText = monthTotalCash.toLocaleString('en-IN', { minimumFractionDigits: 2 });
                document.getElementById('monthOnline').innerText = monthTotalOnline.toLocaleString('en-IN', { minimumFractionDigits: 2 });
                document.getElementById('monthTotal').innerText = monthGrandTotal.toLocaleString('en-IN', { minimumFractionDigits: 2 });

            } catch (error) {
                console.error("Error fetching monthly collection:", error);
            }
        }

        // 2. Submit Collection
        document.getElementById('collectionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            const entryDate = document.getElementById('entryDate').value;
            const cashAmount = parseFloat(document.getElementById('cashAmount').value) || 0;
            const onlineAmount = parseFloat(document.getElementById('onlineAmount').value) || 0;
            const totalAmount = cashAmount + onlineAmount;

            if (totalAmount <= 0) {
                alert("Please enter a valid amount!");
                resetButton(btn);
                return;
            }

            try {
                await addDoc(collection(db, "branch_daily_payments"), {
                    branchName: BRANCH_NAME,
                    date: entryDate,
                    cashAmount: cashAmount,
                    onlineAmount: onlineAmount,
                    totalAmount: totalAmount,
                    timestamp: serverTimestamp()
                });

                alert(`✅ Payment Saved for ${BRANCH_NAME}!`);
                
                document.getElementById('cashAmount').value = '';
                document.getElementById('onlineAmount').value = '';
                document.getElementById('totalAmount').innerText = '0.00';
                
                fetchMonthlyCollection();
                
            } catch (error) {
                console.error("Error saving payment:", error);
                alert("❌ Problem saving data. Check internet connection.");
            }

            resetButton(btn);
        });

        function resetButton(btn) {
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Collection';
            btn.disabled = false;
        }

        window.onload = () => {
            document.getElementById('entryDate').valueAsDate = new Date();
            fetchMonthlyCollection();
        };
    </script>

    <!-- Normal Script for Calculation -->
    <script>
        function calculateTotal() {
            const cash = parseFloat(document.getElementById('cashAmount').value) || 0;
            const online = parseFloat(document.getElementById('onlineAmount').value) || 0;
            const total = cash + online;
            document.getElementById('totalAmount').innerText = total.toFixed(2);
        }
    </script>
</body> 
</html>
