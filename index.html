<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDF STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Custom CSS for app layout */
        body { background-color: #f3f4f6; font-family: sans-serif; margin: 0; }
        
        .app-container { 
            max-width: 480px; 
            margin: 0 auto; 
            background-color: #ffffff; 
            height: 100vh; /* Fixed height for app feel */
            display: flex;
            flex-direction: column;
            position: relative; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
            overflow: hidden; /* Prevent full body scroll */
        }

        /* Middle scrollable section */
        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 20px;
        }

        /* Hide scrollbar for slicker UI */
        .scrollable-content::-webkit-scrollbar { display: none; }
        .scrollable-content { -ms-overflow-style: none; scrollbar-width: none; }

        /* Slider CSS */
        .slider-container { 
            display: flex; 
            overflow-x: auto; 
            scroll-snap-type: x mandatory; 
            scrollbar-width: none; 
        }
        .slider-container::-webkit-scrollbar { display: none; }
        .slide { min-width: 100%; scroll-snap-align: center; }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- Sidebar Overlay -->
        <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden" onclick="toggleSidebar()"></div>
        
        <!-- Sidebar -->
        <div id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white shadow-xl z-50 transform -translate-x-full transition-transform duration-300">
            <div class="p-5 bg-indigo-600 text-white flex justify-between items-center">
                <h2 class="text-xl font-bold">Menu</h2>
                <button onclick="toggleSidebar()" class="text-white text-2xl focus:outline-none">&times;</button>
            </div>
            <div class="p-5">
                <h3 class="text-gray-600 font-bold mb-3 border-b pb-2">Language</h3>
                <div class="flex flex-col gap-3 mt-3">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="lang" value="en" onchange="changeLanguage('en')" checked class="w-4 h-4 text-indigo-600">
                        <span class="text-gray-700 font-medium">English</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="lang" value="bn" onchange="changeLanguage('bn')" class="w-4 h-4 text-indigo-600">
                        <span class="text-gray-700 font-medium">Bengali</span>
                    </label>
                </div>
                <!-- Success Message for Database Save -->
                <p id="langStatus" class="text-xs text-green-600 mt-3 font-semibold hidden"><i class="fas fa-check-circle"></i> Saved to Database!</p>
            </div>
        </div>

        <!-- Header (Fixed at top) -->
        <div class="bg-indigo-600 text-white p-4 flex justify-between items-center shadow-md z-30">
            <button onclick="toggleSidebar()" class="text-2xl focus:outline-none"><i class="fas fa-bars"></i></button>
            <h1 class="text-xl font-bold tracking-wider">SDF STORE</h1>
            <button class="text-xl focus:outline-none"><i class="fas fa-bell"></i></button>
        </div>

        <!-- Scrollable Middle Content -->
        <div class="scrollable-content">
            <!-- Banner Slider (Large) -->
            <div class="relative w-full h-56 bg-gray-200 mb-5">
                <div class="slider-container h-full w-full" id="slider">
                    <img src="https://i.ibb.co/v4QRRGCC/IMG-20261014-WA0004.jpg" class="slide object-cover w-full h-full" alt="Banner 1">
                    <img src="https://i.ibb.co/rRBptQH3/IMG-20261014-WA0002.jpg" class="slide object-cover w-full h-full" alt="Banner 2">
                    <img src="https://i.ibb.co/CpM0nBHg/IMG-20261014-WA0003.jpg" class="slide object-cover w-full h-full" alt="Banner 3">
                </div>
            </div>

            <!-- Main Store Action Card (Large) -->
            <div class="px-4 mb-5 mt-2">
                <a href="store.html" class="block bg-indigo-600 text-white rounded-2xl shadow-lg p-6 flex flex-col items-center justify-center transform transition hover:scale-105 active:scale-95">
                    <i class="fas fa-store text-4xl mb-3"></i>
                    <h2 class="text-2xl font-bold">Main Store</h2>
                    <p class="text-sm text-indigo-200 mt-1">Manage Stock & Send to Branch</p>
                </a>
            </div>

            <h3 class="px-4 text-gray-800 font-bold mb-3 text-lg">Our Branches</h3>

            <!-- Branch Cards Grid (3 small boxes) -->
            <div class="px-4 grid grid-cols-3 gap-3 mb-6">
                <a href="sangrampur.html" class="bg-white border border-gray-100 rounded-xl shadow-md p-3 flex flex-col items-center text-center transform transition hover:scale-105 active:scale-95">
                    <div class="bg-indigo-50 text-indigo-600 p-3 rounded-full mb-2">
                        <i class="fas fa-map-marker-alt text-lg"></i>
                    </div>
                    <span class="text-sm font-bold text-gray-700">Sangrampur</span>
                </a>
                
                <a href="baruipur.html" class="bg-white border border-gray-100 rounded-xl shadow-md p-3 flex flex-col items-center text-center transform transition hover:scale-105 active:scale-95">
                    <div class="bg-indigo-50 text-indigo-600 p-3 rounded-full mb-2">
                        <i class="fas fa-map-marker-alt text-lg"></i>
                    </div>
                    <span class="text-sm font-bold text-gray-700">Baruipur</span>
                </a>
                
                <a href="magrahat.html" class="bg-white border border-gray-100 rounded-xl shadow-md p-3 flex flex-col items-center text-center transform transition hover:scale-105 active:scale-95">
                    <div class="bg-indigo-50 text-indigo-600 p-3 rounded-full mb-2">
                        <i class="fas fa-map-marker-alt text-lg"></i>
                    </div>
                    <span class="text-sm font-bold text-gray-700">Magrahat</span>
                </a>
            </div>

            <!-- WHOLESALE CARD (পাইকারি) -->
            <h3 class="px-4 text-gray-800 font-bold mb-3 text-lg mt-2">Wholesale Billing</h3>
            <div class="px-4 mb-6">
                <a href="wholesale.html" class="block bg-indigo-600 text-white rounded-2xl shadow-lg p-6 flex flex-col items-center justify-center transform transition hover:scale-105 active:scale-95">
                    <i class="fas fa-file-invoice-dollar text-4xl mb-3"></i>
                    <h2 class="text-2xl font-bold">Wholesale (পাইকারি)</h2>
                    <p class="text-sm text-indigo-200 mt-1">Create & Manage Wholesale Bills</p>
                </a>
            </div>
            
            <!-- Extra space to ensure smooth scroll up -->
            <div class="h-10"></div>
        </div>

        <!-- Footer Navigation (Fixed at bottom) -->
        <div class="w-full bg-white border-t border-gray-200 flex justify-around p-3 pb-4 rounded-t-2xl shadow-[0_-5px_15px_rgba(0,0,0,0.05)] z-30">
            <a href="#" class="text-indigo-600 flex flex-col items-center">
                <i class="fas fa-home text-xl mb-1"></i>
                <span class="text-xs font-semibold">Home</span>
            </a>
            <a href="store.html" class="text-gray-400 flex flex-col items-center hover:text-indigo-600 transition">
                <i class="fas fa-box text-xl mb-1"></i>
                <span class="text-xs font-semibold">Stock</span>
            </a>
            <a href="#" class="text-gray-400 flex flex-col items-center hover:text-indigo-600 transition">
                <i class="fas fa-user text-xl mb-1"></i>
                <span class="text-xs font-semibold">Profile</span>
            </a>
        </div>
    </div>

    <script>
        // Auto Slider Script
        const slider = document.getElementById('slider');
        let scrollAmount = 0;
        const slideTimer = setInterval(() => {
            slider.scrollTo({
                top: 0,
                left: (scrollAmount += slider.clientWidth),
                behavior: 'smooth'
            });
            if (scrollAmount >= slider.scrollWidth - slider.clientWidth) {
                scrollAmount = -slider.clientWidth; // reset for infinite loop effect
            }
        }, 3000);

        // Sidebar Toggle Script
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        // Language Change & Database Save Mock Script
        function changeLanguage(lang) {
            const langStatus = document.getElementById('langStatus');
            langStatus.classList.remove('hidden');
            
            setTimeout(() => {
                langStatus.classList.add('hidden');
            }, 2500);

            console.log("Language saved to database: " + lang);
        }
    </script>
</body>
</html>
