<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baruipur Branch - SDF STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f3f4f6; font-family: sans-serif; margin: 0; }
        .app-container { 
            max-width: 480px; 
            margin: 0 auto; 
            background-color: #ffffff; 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            position: relative; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
        }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- Header -->
        <div class="bg-indigo-600 text-white p-4 flex justify-between items-center shadow-md sticky top-0 z-30">
            <a href="index.html" class="text-xl focus:outline-none hover:text-indigo-200"><i class="fas fa-arrow-left"></i></a>
            <h1 class="text-xl font-bold tracking-wider uppercase" id="branchTitle">BARUIPUR</h1>
            <div class="w-6"></div>
        </div>

        <div class="p-4 flex-1">
            
            <!-- Monthly Collection Display -->
            <div class="bg-indigo-50 p-5 rounded-xl border border-indigo-100 mb-5 shadow-sm relative overflow-hidden">
                <div class="absolute -right-4 -top-4 opacity-10">
                    <i class="fas fa-calendar-check text-6xl text-indigo-900"></i>
                </div>
                <p class="text-xs font-bold text-indigo-800 uppercase mb-3">This Month's Collection</p>
                
                <div class="flex justify-between items-end mb-2">
                    <div>
                        <p class="text-[10px] text-gray-500 font-bold"><i class="fas fa-money-bill-wave text-green-500"></i> Cash</p>
                        <h3 class="text-lg font-bold text-green-700">₹ <span id="monthCash">0.00</span></h3>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] text-gray-500 font-bold"><i class="fas fa-mobile-alt text-blue-500"></i> Online</p>
                        <h3 class="text-lg font-bold text-blue-700">₹ <span id="monthOnline">0.00</span></h3>
                    </div>
                </div>
                
                <div class="border-t border-indigo-200 pt-2 mt-2">
                    <p class="text-[10px] text-gray-500 font-bold uppercase">Total Collection (This Month)</p>
                    <h2 class="text-2xl font-bold text-indigo-700">₹ <span id="monthTotal">0.00</span></h2>
                </div>
            </div>

            <!-- Daily Entry Form Box -->
            <div class="bg-white p-4 rounded-xl shadow-md border border-gray-100 mb-4">
                <h3 class="text-xs font-bold text-gray-600 uppercase mb-3 border-b pb-2"><i class="fas fa-cash-register mr-1"></i> Today's Collection Entry</h3>
                
                <form id="collectionForm" class="flex flex-col gap-3">
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase">Select Date</label>
                        <input type="date" id="entryDate" class="w-full border border-gray-300 p-2 rounded-lg focus:outline-none focus:border-indigo-500 bg-gray-50 text-sm font-bold text-gray-700" required>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mt-1">
                        <div>
                            <label class="text-[10px] font-bold text-gray-500 uppercase"><i class="fas fa-money-bill-wave text-green-500"></i> Cash (₹)</label>
                            <input type="number" id="cashAmount" placeholder="0" class="w-full border border-gray-300 p-2 rounded-lg focus:outline-none focus:border-indigo-500 font-bold text-gray-800" oninput="calculateTotal()" required>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-500 uppercase"><i class="fas fa-mobile-alt text-blue-500"></i> Online (₹)</label>
                            <input type="number" id="onlineAmount" placeholder="0" class="w-full border border-gray-300 p-2 rounded-lg focus:outline-none focus:border-indigo-500 font-bold text-gray-800" oninput="calculateTotal()" required>
                        </div>
                    </div>

                    <div class="bg-gray-100 p-3 rounded-lg flex justify-between items-center mt-2 border border-gray-200">
                        <span class="text-xs font-bold text-gray-600 uppercase">Total Today:</span>
                        <span class="text-lg font-bold text-gray-800">₹ <span id="totalAmount">0.00</span></span>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg mt-2 shadow-sm transform transition hover:scale-105 active:scale-95 flex justify-center items-center gap-2">
                        <i class="fas fa-paper-plane"></i> Submit Collection
                    </button>
                </form>
            </div>

            <!-- Views / History Button -->
            <a href="branch_views.html?branch=Baruipur" class="w-full block text-center bg-indigo-100 text-indigo-700 border border-indigo-200 font-bold py-3 rounded-lg shadow-sm transform transition hover:scale-105 active:scale-95">
                <i class="fas fa-history mr-1"></i> View Collection History
            </a>
            
            <div class="h-10"></div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9-KJ4UGuqjqca8yBZItdp6FmESI4qGGY",
            authDomain: "sdf-store-f39bd.firebaseapp.com",
            projectId: "sdf-store-f39bd",
            storageBucket: "sdf-store-f39bd.firebasestorage.app",
            messagingSenderId: "988561141451",
            appId: "1:988561141451:web:5778ab813d980c3f6df54e",
            measurementId: "G-WH88QMN0Z5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Branch Name Setup
        const BRANCH_NAME = "Baruipur"; 

        async function fetchMonthlyCollection() {
            try {
                const currentDate = new Date();
                const currentMonthString = currentDate.toISOString().slice(0, 7); 

                const q = query(
                    collection(db, "branch_daily_payments"), 
                    where("branchName", "==", BRANCH_NAME)
                );
                
                const querySnapshot = await getDocs(q);
                
                let monthTotalCash = 0;
                let monthTotalOnline = 0;
                let monthGrandTotal = 0;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.date && data.date.startsWith(currentMonthString)) {
                        monthTotalCash += parseFloat(data.cashAmount) || 0;
                        monthTotalOnline += parseFloat(data.onlineAmount) || 0;
                        monthGrandTotal += parseFloat(data.totalAmount) || 0;
                    }
                });

                document.getElementById('monthCash').innerText = monthTotalCash.toFixed(2);
                document.getElementById('monthOnline').innerText = monthTotalOnline.toFixed(2);
                document.getElementById('monthTotal').innerText = monthGrandTotal.toFixed(2);

            } catch (error) {
                console.error("Error fetching monthly collection:", error);
            }
        }

        document.getElementById('collectionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            const entryDate = document.getElementById('entryDate').value;
            const cashAmount = parseFloat(document.getElementById('cashAmount').value) || 0;
            const onlineAmount = parseFloat(document.getElementById('onlineAmount').value) || 0;
            const totalAmount = cashAmount + onlineAmount;

            if (totalAmount <= 0) {
                alert("Please enter a valid amount!");
                resetButton(btn);
                return;
            }

            try {
                await addDoc(collection(db, "branch_daily_payments"), {
                    branchName: BRANCH_NAME,
                    date: entryDate,
                    cashAmount: cashAmount,
                    onlineAmount: onlineAmount,
                    totalAmount: totalAmount,
                    timestamp: serverTimestamp()
                });

                alert(`✅ Payment Saved for ${BRANCH_NAME}!`);
                
                document.getElementById('cashAmount').value = '';
                document.getElementById('onlineAmount').value = '';
                document.getElementById('totalAmount').innerText = '0.00';
                
                fetchMonthlyCollection();
                
            } catch (error) {
                console.error("Error saving payment:", error);
                alert("❌ Problem saving data. Check internet connection.");
            }

            resetButton(btn);
        });

        function resetButton(btn) {
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Collection';
            btn.disabled = false;
        }

        window.onload = () => {
            document.getElementById('entryDate').valueAsDate = new Date();
            fetchMonthlyCollection();
        };
    </script>

    <script>
        function calculateTotal() {
            const cash = parseFloat(document.getElementById('cashAmount').value) || 0;
            const online = parseFloat(document.getElementById('onlineAmount').value) || 0;
            const total = cash + online;
            document.getElementById('totalAmount').innerText = total.toFixed(2);
        }
    </script>
</body>
</html>
